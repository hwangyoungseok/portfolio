<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>감사로그 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="audit-log.css">
</head>
<body data-page="admin/audit-log">

<!--
  화면: 관리 > 감사로그   (호스트 모드 전용)
  설명: 사용자 활동 및 시스템 변경 이력 조회.
        [감사 로그] 탭 - HTTP 요청 단위 감사 로그 (상태코드/메서드/URL/소요시간/예외)
        [엔티티 변경 사항] 탭 - 엔티티 단위 변경 이력 (생성/수정/삭제, 필드별 이전값→새값)
        행의 [상세] 버튼으로 요청 상세 팝업(전체 / 작업 탭)을 연다.
  ---------------------------------------------------------------------
   - 공통 컴포넌트(.search-bar / .grid-wrap / .toolbar / .grid-table / .paging /
     .modal-overlay+.modal 등)는 shared/common.css 참고
-->

<div id="umsContent">
  <div class="content">

    <!-- 탭 -->
    <div class="tabs">
      <div class="tab active" id="tabBtn-log"    onclick="switchTab('log')">감사 로그</div>
      <div class="tab"        id="tabBtn-entity" onclick="switchTab('entity')">엔티티 변경 사항</div>
    </div>

    <!-- ============ 감사 로그 탭 ============ -->
    <div class="tab-pane show" id="tab-log">

      <div class="search-bar">
        <div class="search-field"><label>기간</label>
          <input class="search-input" id="fFrom" type="date" style="min-width:140px;">
          <span style="color:#98a2b3;">~</span>
          <input class="search-input" id="fTo" type="date" style="min-width:140px;">
        </div>
        <div class="search-field"><label>HTTP 메서드</label>
          <select class="search-select" id="fMethod" style="min-width:100px;">
            <option value="">전체</option>
            <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
          </select>
        </div>
        <div class="search-field"><label>상태 코드</label>
          <select class="search-select" id="fCode" style="min-width:100px;">
            <option value="">전체</option>
            <option value="2">2xx</option><option value="3">3xx</option>
            <option value="4">4xx</option><option value="5">5xx</option>
          </select>
        </div>
        <div class="search-field"><label>예외 발생 여부</label>
          <select class="search-select" id="fExc" style="min-width:90px;">
            <option value="">전체</option>
            <option value="y">발생</option>
            <option value="n">미발생</option>
          </select>
        </div>
        <div class="search-field"><label>소요 시간</label>
          <input class="search-input" id="fMin" type="number" min="0" placeholder="최소" style="min-width:80px;">
          <span style="color:#98a2b3;">~</span>
          <input class="search-input" id="fMax" type="number" min="0" placeholder="최대" style="min-width:80px;">
          <span class="hint">ms</span>
        </div>
        <div class="search-field"><label>상관관계 ID</label>
          <input class="search-input" id="fCorr" placeholder="Correlation ID" style="min-width:180px;">
        </div>
        <div class="search-field"><label>검색어</label>
          <input class="search-input" id="q" placeholder="URL / 사용자 / IP"
                 onkeyup="if(event.key==='Enter')renderLog()">
        </div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="renderLog()">&#128269; 검색</button>
          <button class="btn" onclick="resetLog()">지우기</button>
        </div>
      </div>

      <div class="grid-wrap">
        <div class="toolbar">
          <span style="font-size:12px;color:#666;">총 <b id="logCount">0</b>건</span>
          <span class="toolbar-spacer"></span>
          <button class="btn" onclick="umsToast('엑셀 다운로드 (목업)')">엑셀 다운로드</button>
        </div>

        <div class="grid-scroll">
          <table class="grid-table" id="logTable">
            <thead>
              <tr>
                <th style="width:84px;">작업</th>
                <th>HTTP 요청</th>
                <th>사용자 이름</th>
                <th>클라이언트 IP 주소</th>
                <th class="sortable" data-sort="time" onclick="sortLog('time')">실행 시간<span class="sort-ind"></span></th>
                <th class="sortable" data-sort="dur"  onclick="sortLog('dur')">소요 시간(ms)<span class="sort-ind"></span></th>
                <th>애플리케이션 이름</th>
                <th>상관관계 ID</th>
                <th>URL</th>
                <th style="width:90px;">예외 발생 여부</th>
              </tr>
            </thead>
            <tbody id="logBody"></tbody>
          </table>
        </div>

        <div class="pane-paging">
          <select class="search-select" id="lSize" onchange="lGo('size')" style="min-width:70px;">
            <option>10</option><option>20</option><option>50</option>
          </select>
          <span class="hint">건씩 보기</span>
          <span class="page-info" id="lInfo">0 - 0 / 전체 0 건</span>
          <span class="toolbar-spacer"></span>
          <button class="page-btn" onclick="lGo('first')">처음</button>
          <button class="page-btn" onclick="lGo('prev')">이전</button>
          <button class="page-btn active" id="lNo">1</button>
          <button class="page-btn" onclick="lGo('next')">다음</button>
          <button class="page-btn" onclick="lGo('last')">마지막</button>
        </div>
      </div>
    </div>

    <!-- ============ 엔티티 변경 사항 탭 ============ -->
    <div class="tab-pane" id="tab-entity">

      <div class="search-bar">
        <div class="search-field"><label>기간</label>
          <input class="search-input" id="eFrom" type="date" style="min-width:140px;">
          <span style="color:#98a2b3;">~</span>
          <input class="search-input" id="eTo" type="date" style="min-width:140px;">
        </div>
        <div class="search-field"><label>변경 유형</label>
          <select class="search-select" id="eType" style="min-width:100px;">
            <option value="">전체</option>
            <option value="C">생성</option>
            <option value="U">수정</option>
            <option value="D">삭제</option>
          </select>
        </div>
        <div class="search-field"><label>엔티티</label><select class="search-select" id="eEntity"></select></div>
        <div class="search-field"><label>검색어</label>
          <input class="search-input" id="eq" placeholder="엔티티 ID / 사용자"
                 onkeyup="if(event.key==='Enter')renderEntity()">
        </div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="renderEntity()">&#128269; 검색</button>
          <button class="btn" onclick="resetEntity()">지우기</button>
        </div>
      </div>

      <div class="grid-wrap">
        <div class="toolbar">
          <span style="font-size:12px;color:#666;">총 <b id="entityCount">0</b>건</span>
          <span class="toolbar-spacer"></span>
          <button class="btn" onclick="umsToast('엑셀 다운로드 (목업)')">엑셀 다운로드</button>
        </div>

        <div class="grid-scroll">
          <table class="grid-table">
            <thead>
              <tr>
                <th style="width:84px;">작업</th>
                <th style="width:80px;">변경 유형</th>
                <th>엔티티</th>
                <th>엔티티 ID</th>
                <th>변경 필드</th>
                <th>사용자 이름</th>
                <th>변경 일시</th>
                <th>상관관계 ID</th>
              </tr>
            </thead>
            <tbody id="entityBody"></tbody>
          </table>
        </div>

        <div class="pane-paging">
          <select class="search-select" id="eSize" onchange="eGo('size')" style="min-width:70px;">
            <option>10</option><option>20</option><option>50</option>
          </select>
          <span class="hint">건씩 보기</span>
          <span class="page-info" id="eInfo">0 - 0 / 전체 0 건</span>
          <span class="toolbar-spacer"></span>
          <button class="page-btn" onclick="eGo('first')">처음</button>
          <button class="page-btn" onclick="eGo('prev')">이전</button>
          <button class="page-btn active" id="eNo">1</button>
          <button class="page-btn" onclick="eGo('next')">다음</button>
          <button class="page-btn" onclick="eGo('last')">마지막</button>
        </div>
      </div>
    </div>

  </div>

  <!-- 감사 로그 상세 팝업 -->
  <div class="modal-overlay" id="logModal">
    <div class="modal">
      <div class="modal-header">
        <h3>상세</h3>
        <button class="modal-close" onclick="logModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="tabs modal-tabs">
          <div class="tab active" id="dtabBtn-all" onclick="switchDetailTab('all')">전체</div>
          <div class="tab"        id="dtabBtn-act" onclick="switchDetailTab('act')">작업 (<span id="dActCount">0</span>)</div>
        </div>
        <div id="dtab-all" class="dtab-pane show"></div>
        <div id="dtab-act" class="dtab-pane"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="logModalClose()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 엔티티 변경 상세 팝업 -->
  <div class="modal-overlay" id="entityModal">
    <div class="modal">
      <div class="modal-header">
        <h3>엔티티 변경 상세</h3>
        <button class="modal-close" onclick="entityModalClose()">&#10005;</button>
      </div>
      <div class="modal-body" id="entityBodyDetail"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="entityModalClose()">닫기</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="audit-log.js"></script>
</body>
</html>
