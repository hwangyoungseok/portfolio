<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작업 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="job.css">
</head>
<body data-page="admin/job">

<!--
  화면: 관리 > 작업   (호스트 모드 전용)
  설명: 백그라운드 작업(스케줄러) 목록과 제어.
        행마다 [작업] 드롭다운으로 일시중지/재개 · 즉시 실행 · 취소 · 이력 보기.
        작업 이름 / [이력 보기] 는 별도 페이지(admin/job-history)로 이동한다.
  ---------------------------------------------------------------------
   - 공통 컴포넌트(.search-bar / .grid-wrap / .grid-table / .modal-overlay+.modal /
     .badge / umsToast 등)는 shared/common.css 참고
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색 -->
    <div class="search-bar search-main">
      <input class="search-input search-wide" id="q" placeholder="검색 (작업 이름 / 그룹)"
             onkeyup="if(event.key==='Enter')renderGrid()">
      <button class="btn btn-primary" onclick="renderGrid()">&#128269; 검색</button>
    </div>

    <!-- 그리드 -->
    <div class="grid-wrap">
      <div class="grid-scroll">
        <table class="grid-table" id="jobTable">
          <thead>
            <tr>
              <th style="width:96px;">작업</th>
              <th class="sortable" data-sort="name"   onclick="sortBy('name')">작업 이름<span class="sort-ind"></span></th>
              <th style="width:170px;">스케줄</th>
              <th class="sortable" data-sort="state"  onclick="sortBy('state')" style="width:110px;">상태<span class="sort-ind"></span></th>
              <th class="sortable" data-sort="next"   onclick="sortBy('next')" style="width:190px;">다음 실행<span class="sort-ind"></span></th>
              <th class="sortable" data-sort="last"   onclick="sortBy('last')" style="width:190px;">마지막 실행<span class="sort-ind"></span></th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="pane-paging">
        <select class="search-select" id="pSize" onchange="go('size')" style="min-width:70px;">
          <option>10</option><option>20</option><option>50</option>
        </select>
        <span class="hint">건씩 보기</span>
        <span class="page-info" id="pInfo">0 - 0 / 전체 0 건</span>
        <span class="toolbar-spacer"></span>
        <button class="page-btn" onclick="go('first')">처음</button>
        <button class="page-btn" onclick="go('prev')">이전</button>
        <button class="page-btn active" id="pNo">1</button>
        <button class="page-btn" onclick="go('next')">다음</button>
        <button class="page-btn" onclick="go('last')">마지막</button>
      </div>
    </div>

  </div>

  <!-- 행 [작업] 드롭다운 -->
  <div id="jobMenu" class="drop-menu">
    <div class="tmenu-item" id="mi-pause" onclick="menuAct('pause')"><span class="mi-ico">&#10074;&#10074;</span> 일시중지</div>
    <div class="tmenu-item" onclick="menuAct('run')"><span class="mi-ico">&#9889;</span> 즉시 실행</div>
    <div class="tmenu-item" onclick="menuAct('cancel')"><span class="mi-ico">&#128683;</span> 취소</div>
    <div class="tmenu-item" onclick="menuAct('history')"><span class="mi-ico">&#9776;</span> 이력 보기</div>
  </div>

</div>

<script src="../../shared/layout.js"></script>
<script src="job.js"></script>
</body>
</html>
