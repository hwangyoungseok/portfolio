<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조직 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="id-org.css">
</head>
<body data-page="admin/id-org">

<!--
  화면: 관리 > ID 관리 > 조직   (호스트 모드 전용)
  설명: 조직 단위(부서/그룹) 트리 등록·수정·삭제 및 소속 구성원 / 역할 관리.
        좌측 조직 트리에서 단위를 선택하면 우측에 [구성원] / [역할] 탭이 표시된다.
        트리 노드의 ▾ 버튼으로 하위 단위 추가 / 이름 수정 / 삭제.
  ---------------------------------------------------------------------
   - 공통 컴포넌트(.grid-table / .modal-overlay+.modal / .form-grid / .btn / umsToast 등)는
     shared/common.css 참고
   - 트리 스타일은 pages/facility/location-manage.* 와 같은 패턴
-->

<div id="umsContent">
  <div class="content">
    <div class="org-wrap">

      <!-- 좌측: 조직 트리 -->
      <div class="org-tree">
        <div class="org-tree-head">
          <b>조직 트리</b>
          <button class="btn btn-primary" onclick="orgOpen(null, null)">+ 최상위 단위 추가</button>
        </div>
        <div class="org-tree-body" id="orgTree"></div>
      </div>

      <!-- 우측: 선택한 조직의 구성원 / 역할 -->
      <div class="org-detail" id="orgDetail">

        <div class="tabs">
          <div class="tab active" id="tabBtn-member" onclick="switchTab('member')">구성원</div>
          <div class="tab"        id="tabBtn-role"   onclick="switchTab('role')">역할</div>
        </div>

        <!-- 구성원 탭 -->
        <div class="tab-pane show" id="tab-member">
          <div class="pane-head">
            <h3 id="memberTitle">-</h3>
            <button class="btn btn-primary" onclick="memberAddOpen()">+ 구성원 추가</button>
          </div>

          <div class="pane-search">
            <label>검색</label>
            <input class="search-input" id="mq" placeholder="이름 / 이메일"
                   onkeyup="if(event.key==='Enter')renderMembers()">
            <button class="btn" onclick="renderMembers()">검색</button>
          </div>

          <div class="pane-grid">
            <table class="grid-table" id="memberTable">
              <thead>
                <tr>
                  <th style="width:70px;">삭제</th>
                  <th class="sortable" data-sort="name"  onclick="sortMember('name')">사용자 이름<span class="sort-ind"></span></th>
                  <th class="sortable" data-sort="email" onclick="sortMember('email')">이메일 주소<span class="sort-ind"></span></th>
                  <th>역할</th>
                </tr>
              </thead>
              <tbody id="memberBody"></tbody>
            </table>
          </div>

          <div class="pane-paging">
            <select class="search-select" id="mSize" onchange="mPage=1;renderMembers()" style="min-width:70px;">
              <option>10</option><option>20</option><option>50</option>
            </select>
            <span class="hint">건씩 보기</span>
            <span class="page-info" id="mInfo">0 - 0 / 전체 0 건</span>
            <span class="toolbar-spacer"></span>
            <button class="page-btn" onclick="mGo('first')">처음</button>
            <button class="page-btn" onclick="mGo('prev')">이전</button>
            <button class="page-btn active" id="mPageNo">1</button>
            <button class="page-btn" onclick="mGo('next')">다음</button>
            <button class="page-btn" onclick="mGo('last')">마지막</button>
          </div>
        </div>

        <!-- 역할 탭 -->
        <div class="tab-pane" id="tab-role">
          <div class="pane-head">
            <h3 id="roleTitle">-</h3>
            <button class="btn btn-primary" onclick="roleAddOpen()">+ 역할 추가</button>
          </div>

          <div class="pane-grid">
            <table class="grid-table">
              <thead>
                <tr>
                  <th style="width:70px;">삭제</th>
                  <th>역할 이름</th>
                  <th>설명</th>
                </tr>
              </thead>
              <tbody id="roleBody"></tbody>
            </table>
          </div>

          <div class="pane-paging">
            <span class="page-info" id="rInfo">0 - 0 / 전체 0 건</span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 트리 노드 [▾] 드롭다운 -->
  <div id="orgMenu">
    <div class="tmenu-item" onclick="nodeAct('add')">하위 단위 추가</div>
    <div class="tmenu-item" onclick="nodeAct('edit')">이름 수정</div>
    <div class="tmenu-sep"></div>
    <div class="tmenu-item danger" onclick="nodeAct('delete')">삭제</div>
  </div>

  <!-- 조직 단위 등록/수정 모달 -->
  <div class="modal-overlay" id="orgModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="oTitle">조직 단위 추가</h3>
        <button class="modal-close" onclick="orgModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-label">상위 단위</div><div class="dv-box" id="o-parent">-</div>
          <div class="form-label req">단위 이름</div><input class="form-input" id="o-name" placeholder="예: 인프라운영팀">
          <div class="form-label">설명</div><input class="form-input" id="o-desc">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="orgModalClose()">취소</button>
        <button class="btn btn-primary" onclick="orgSave()">저장</button>
      </div>
    </div>
  </div>

  <!-- 구성원 추가 모달 -->
  <div class="modal-overlay" id="memberModal">
    <div class="modal">
      <div class="modal-header">
        <h3>구성원 추가</h3>
        <button class="modal-close" onclick="memberModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="pane-search" style="margin-bottom:12px;">
          <input class="search-input" id="pickq" placeholder="이름 / 이메일 검색" style="flex:1;"
                 onkeyup="renderPickList()">
        </div>
        <div class="pick-list" id="pickList"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="memberModalClose()">취소</button>
        <button class="btn btn-primary" onclick="memberAddSave()">추가</button>
      </div>
    </div>
  </div>

  <!-- 역할 추가 모달 -->
  <div class="modal-overlay" id="roleModal">
    <div class="modal">
      <div class="modal-header">
        <h3>역할 추가</h3>
        <button class="modal-close" onclick="roleModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="pick-list" id="rolePickList"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="roleModalClose()">취소</button>
        <button class="btn btn-primary" onclick="roleAddSave()">추가</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 -->
  <div class="modal-overlay" id="delModal">
    <div class="confirm-modal">
      <p id="d-msg"></p>
      <div class="confirm-btns">
        <button class="btn btn-primary" onclick="delConfirm()">예</button>
        <button class="btn btn-danger" onclick="delModalClose()">아니오</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="id-org.js"></script>
</body>
</html>
