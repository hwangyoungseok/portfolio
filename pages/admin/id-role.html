<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>역할 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="id-role.css">
</head>
<body data-page="admin/id-role">

<!--
  화면: 관리 > ID 관리 > 역할   (호스트 모드 전용)
  설명: 역할(권한 그룹) 정의 및 메뉴·기능 권한 부여, 사용자 역할 매핑.
        역할 목록/사용자 수는 [조직] · [사용자] 화면과 동일한 집합을 사용한다.
        행마다 [작업] 드롭다운으로 편집 / 권한 / 사용자 보기 / 삭제.
  ---------------------------------------------------------------------
   - 공통 컴포넌트(.search-bar / .grid-wrap / .grid-table / .modal-overlay+.modal /
     .form-grid / .switch / .badge / umsToast 등)는 shared/common.css 참고
-->

<div id="umsContent">
  <div class="content">

    <!-- 상단 액션 -->
    <div class="page-actions">
      <button class="btn btn-primary" onclick="roleOpen(null)">+ 새 역할</button>
    </div>

    <!-- 검색 -->
    <div class="search-bar search-main">
      <input class="search-input search-wide" id="q" placeholder="검색 (역할 이름 / 설명)"
             onkeyup="if(event.key==='Enter')renderGrid()">
      <button class="btn btn-primary" onclick="renderGrid()">&#128269; 검색</button>
    </div>

    <!-- 그리드 -->
    <div class="grid-wrap">
      <div class="grid-scroll">
        <table class="grid-table" id="roleTable">
          <thead>
            <tr>
              <th style="width:96px;">작업</th>
              <th class="sortable" data-sort="name" onclick="sortBy('name')">역할 이름<span class="sort-ind"></span></th>
              <th>설명</th>
              <th style="width:110px;">권한</th>
              <th class="sortable" data-sort="users" onclick="sortBy('users')" style="width:110px;">사용자 수<span class="sort-ind"></span></th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="pane-paging">
        <select class="search-select" id="pSize" onchange="page=1;renderGrid()" style="min-width:70px;">
          <option>10</option><option>20</option><option>50</option>
        </select>
        <span class="hint">건씩 보기</span>
        <span class="page-info" id="pInfo">0 - 0 / 전체 0 건</span>
        <span class="toolbar-spacer"></span>
        <button class="page-btn" onclick="go('first')">처음</button>
        <button class="page-btn" onclick="go('prev')">이전</button>
        <button class="page-btn active" id="pNo">1</button>
        <button class="page-btn" onclick="go('next')">다음</button>
        <button class="page-btn" onclick="go('last')">마지막</button>
      </div>
    </div>

  </div>

  <!-- 행 [작업] 드롭다운 -->
  <div id="roleMenu" class="drop-menu">
    <div class="tmenu-item" onclick="menuAct('edit')">편집</div>
    <div class="tmenu-item" onclick="menuAct('perm')">권한</div>
    <div class="tmenu-item" onclick="menuAct('users')">사용자 보기</div>
    <div class="tmenu-sep"></div>
    <div class="tmenu-item danger" onclick="menuAct('delete')">삭제</div>
  </div>

  <!-- 역할 등록/수정 모달 -->
  <div class="modal-overlay" id="roleModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="mTitle">새 역할</h3>
        <button class="modal-close" onclick="roleModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-label req">역할 이름</div><input class="form-input" id="m-name">
          <div class="form-label">설명</div><input class="form-input" id="m-desc">
          <div class="form-label">기본 역할</div>
          <div class="switch-field">
            <label class="switch"><input type="checkbox" id="m-default"><span class="switch-track"></span></label>
            <span id="m-defaultText">사용 안 함</span>
            <span class="hint">신규 사용자에게 자동으로 부여됩니다.</span>
          </div>
          <div class="form-label">공개</div>
          <div class="switch-field">
            <label class="switch"><input type="checkbox" id="m-public" checked><span class="switch-track"></span></label>
            <span id="m-publicText">공개</span>
            <span class="hint">조직 역할 지정 시 선택할 수 있습니다.</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="roleModalClose()">취소</button>
        <button class="btn btn-primary" onclick="roleSave()">저장</button>
      </div>
    </div>
  </div>

  <!-- 권한 모달 -->
  <div class="modal-overlay" id="permModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="pTitle">권한</h3>
        <button class="modal-close" onclick="permModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="perm-toolbar">
          <span class="hint">부여된 권한 <b id="permCount">0</b> / <span id="permTotal">0</span></span>
          <span class="toolbar-spacer"></span>
          <button class="btn" onclick="permAll(true)">전체 선택</button>
          <button class="btn" onclick="permAll(false)">전체 해제</button>
        </div>
        <div id="permList"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="permModalClose()">취소</button>
        <button class="btn btn-primary" onclick="permSave()">저장</button>
      </div>
    </div>
  </div>

  <!-- 사용자 보기 모달 -->
  <div class="modal-overlay" id="usersModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="uTitle">사용자</h3>
        <button class="modal-close" onclick="usersModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <table class="mini-table">
          <thead><tr><th>사용자 이름</th><th>이름</th><th>조직</th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="usersModalClose()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 -->
  <div class="modal-overlay" id="delModal">
    <div class="confirm-modal">
      <p id="d-msg"></p>
      <div class="confirm-btns">
        <button class="btn btn-primary" id="d-yes" onclick="roleDelete()">예</button>
        <button class="btn btn-danger" onclick="delModalClose()">아니오</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="id-role.js"></script>
</body>
</html>
