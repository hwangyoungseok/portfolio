<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설정 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="setting.css">
</head>
<body data-page="admin/setting">

<!--
  화면: 관리 > 설정   (호스트 모드 전용)
  설명: 시스템 공통 설정 — 기본 정책, 알림/메일 발송, 연동 키 등 호스트 전역 설정 관리.
  ---------------------------------------------------------------------
  작업 방법:
   - 아래 <div class="content"> 안에 화면 본문만 작성 (사이드바/헤더/푸터는 layout.js가 자동)
   - 공통 컴포넌트(.search-bar / .grid-wrap / .toolbar / .grid-table / .paging /
     .modal-overlay+.modal / .form-grid / .badge / .switch / umsToast 등)는 shared/common.css 참고
   - 참고 구현: pages/saas/tenant.*  (그리드+검색+행 작업 드롭다운+모달),
                pages/facility/location-manage.*  (좌측 트리+우측 입력영역)
   - 완성하면 shared/layout.js 의 DONE 목록에 "admin/setting" 추가
-->

<div id="umsContent">
  <div class="content">
    <div class="placeholder-card">설정 &mdash; 작업 예정</div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="setting.js"></script>
</body>
</html>
