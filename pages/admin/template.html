<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>템플릿 관리 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="template.css">
</head>
<body data-page="admin/template">

<!--
  화면: 관리 > 템플릿 관리   (호스트 모드 전용)
  설명: 화면/알람/보고서 등에 쓰이는 템플릿 등록·수정·삭제 및 버전 관리.
  ---------------------------------------------------------------------
  작업 방법:
   - 아래 <div class="content"> 안에 화면 본문만 작성 (사이드바/헤더/푸터는 layout.js가 자동)
   - 공통 컴포넌트(.search-bar / .grid-wrap / .toolbar / .grid-table / .paging /
     .modal-overlay+.modal / .form-grid / .badge / .drawer / umsToast 등)는 shared/common.css 참고
   - 참고 구현: pages/facility/ups-list.*  (그리드+검색+모달+우측 상세패널),
                pages/facility/location-manage.*  (좌측 트리+우측 입력영역)
   - 완성하면 shared/layout.js 의 DONE 목록에 "admin/template" 추가
-->

<div id="umsContent">
  <div class="content">
    <div class="placeholder-card">템플릿 관리 &mdash; 작업 예정</div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="template.js"></script>
</body>
</html>
