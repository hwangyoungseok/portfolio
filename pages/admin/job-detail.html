<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>작업 이력 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="job-detail.css">
</head>
<body data-page="admin/job-detail">

<!--
  화면: 관리 > 작업 관리 > (작업 상세)   (호스트 모드 전용)
  설명: 특정 백그라운드 작업의 상세 정보(좌측)와 그 작업의 실행 이력(우측).
        메뉴에는 없고, [작업] 목록이나 [실행 이력] 목록에서 작업 이름을 눌러 진입한다.
        진입 시 ?job=<작업이름> 이 붙으며, 상단 선택 박스로 다른 작업으로 바꿀 수 있다.
  ---------------------------------------------------------------------
   - 공통 컴포넌트(.badge / .grid-table / .search-select 등)는 shared/common.css 참고
-->

<div id="umsContent">
  <div class="content">

    <!-- 작업 선택 + 제목 -->
    <div class="jh-head">
      <h2 class="jh-title" id="jobTitle">-</h2>
      <div class="jh-picker">
        <label>작업</label>
        <select class="search-select" id="jobPick" onchange="selectJob(this.value)"></select>
        <a class="btn" id="backLink">목록으로</a>
      </div>
    </div>

    <div class="jh-wrap">

      <!-- 좌측: 작업 정보 -->
      <div class="jh-card jh-info">
        <h3 class="jh-card-title">작업</h3>

        <dl class="jh-dl" id="jobSummary"></dl>
        <div class="jh-divider"></div>
        <dl class="jh-dl jh-dl-mono" id="jobDetail"></dl>
      </div>

      <!-- 우측: 실행 이력 -->
      <div class="jh-card jh-hist">
        <h3 class="jh-card-title">실행 이력</h3>
        <div class="jh-hist-scroll">
          <table class="grid-table" id="histTable">
            <thead>
              <tr>
                <th style="width:90px;">상태</th>
                <th>예정 시각</th>
                <th style="width:110px;">소요 시간</th>
                <th style="width:80px;">재시도</th>
                <th style="width:170px;">노드</th>
              </tr>
            </thead>
            <tbody id="histBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="job-detail.js"></script>
</body>
</html>
