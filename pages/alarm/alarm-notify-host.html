<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알람 알림 설정 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="alarm-notify-host.css">
</head>
<body data-page="alarm/alarm-notify-host">

<!--
  화면: 알람 > 알람 알림 설정 (호스트 전용)
  설명: 고객사 설비에서 알람이 발생했을 때, 심각도별로 호스트(우리 쪽) 누구에게 통지할지 설정.
        고객이 만든 체크 룰의 Action과는 완전히 별개로 평가·발송된다(GW 알림 설정과 같은 구조).
        심각도마다 규칙(대상 그룹/채널)을 여러 개 추가할 수 있다. 규칙별 사용/해제 토글은
        값을 지우지 않고 켜고 끄기만 함(삭제와 별개).
        대상 그룹은 [알람 알림 그룹 관리]에서 등록한 그룹을 그대로 사용.
  참고: docu/2.design/GW_개발요구사항.txt (GW 알림 설정과 동일 패턴)
-->

<div id="umsContent">
  <div class="content">

    <div class="anh-note">
      <b>호스트 전역 규칙</b> — 어느 고객사든 아래 심각도의 알람이 발생하면 지정한 대상에게 통지합니다.
      고객이 만든 체크 룰의 알림 Action과는 별개로 동작해요.
    </div>

    <div class="anh-list" id="anhList"></div>

    <div class="anh-bottom">
      <span id="anhSaved" class="anh-saved"></span>
      <span class="toolbar-spacer"></span>
      <button class="btn" onclick="anhReset()">기본값</button>
      <button class="btn btn-primary" onclick="anhSave()">저장</button>
    </div>

  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="alarm-notify-host.js"></script>
</body>
</html>
