<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요청 내역 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="requests.css">
</head>
<body data-page="subscribe/requests">

<!--
  화면: 구독 > 요청 내역   (고객 모드 전용)
  설명: 구독 변경/연장/해지 요청의 진행 상태 조회.
        [구독 현황]에서 보낸 요청은 localStorage 에 저장되어 목록 맨 위에 함께 표시된다.
        접수(new) 상태의 요청만 취소할 수 있다.
  ---------------------------------------------------------------------
   - 공통 컴포넌트(.search-bar / .grid-wrap / .grid-table / .modal-overlay+.modal / .badge 등)는
     shared/common.css 참고
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색조건 -->
    <div class="search-bar">
      <div class="search-field"><label>요청 유형</label>
        <select class="search-select" id="fType">
          <option value="">전체</option>
          <option value="change">에디션 변경</option>
          <option value="extend">기간 연장</option>
          <option value="cancel">해지</option>
        </select></div>
      <div class="search-field"><label>처리 상태</label>
        <select class="search-select" id="fState">
          <option value="">전체</option>
          <option value="new">접수</option>
          <option value="review">검토 중</option>
          <option value="done">승인</option>
          <option value="reject">반려</option>
          <option value="canceled">취소</option>
        </select></div>
      <div class="search-field"><label>검색어</label>
        <input class="search-input" id="q" placeholder="요청번호 / 에디션 / 사유"
               onkeyup="if(event.key==='Enter')renderGrid()"></div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="renderGrid()">조회</button>
        <button class="btn" onclick="resetSearch()">초기화</button>
      </div>
    </div>

    <!-- 그리드 -->
    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gridCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <a class="btn btn-primary" id="newReq">+ 구독 요청</a>
      </div>

      <div class="grid-scroll">
        <table class="grid-table" id="reqTable">
          <thead>
            <tr>
              <th style="width:90px;">상세</th>
              <th style="width:130px;">요청번호</th>
              <th class="sortable" data-sort="at" onclick="sortBy('at')" style="width:150px;">요청 일시<span class="sort-ind"></span></th>
              <th style="width:110px;">요청 유형</th>
              <th>내용</th>
              <th style="width:110px;">희망 적용일</th>
              <th style="width:100px;">처리 상태</th>
              <th style="width:150px;">처리 일시</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="pane-paging">
        <select class="search-select" id="pSize" onchange="go('size')" style="min-width:70px;">
          <option>10</option><option>20</option><option>50</option>
        </select>
        <span class="hint">건씩 보기</span>
        <span class="page-info" id="pInfo">0 - 0 / 전체 0 건</span>
        <span class="toolbar-spacer"></span>
        <button class="page-btn" onclick="go('first')">처음</button>
        <button class="page-btn" onclick="go('prev')">이전</button>
        <button class="page-btn active" id="pNo">1</button>
        <button class="page-btn" onclick="go('next')">다음</button>
        <button class="page-btn" onclick="go('last')">마지막</button>
      </div>
    </div>

  </div>

  <!-- 요청 상세 모달 -->
  <div class="modal-overlay" id="detModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="dTitle">요청 상세</h3>
        <button class="modal-close" onclick="detModalClose()">&#10005;</button>
      </div>
      <div class="modal-body" id="detBody"></div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="cancelBtn" onclick="askCancel()">요청 취소</button>
        <button class="btn btn-primary" onclick="detModalClose()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 취소 확인 -->
  <div class="modal-overlay" id="delModal">
    <div class="confirm-modal">
      <p id="c-msg"></p>
      <div class="confirm-btns">
        <button class="btn btn-primary" onclick="doCancel()">예</button>
        <button class="btn btn-danger" onclick="delModalClose()">아니오</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="requests.js"></script>
</body>
</html>
