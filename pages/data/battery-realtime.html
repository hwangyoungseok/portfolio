<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배터리 실시간 모니터링 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="battery-realtime.css">
</head>
<body data-page="data/battery-realtime">

<!--
  화면: 데이터 조회 > 배터리 실시간 모니터링
  설명: 현재 시점 배터리 상태를 카드/게이지로 표시(SOC·SOH 게이지, 온도, 상태색상). 자동 새로고침 주기 표시 + on/off 토글.
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색조건 -->
    <div class="search-bar">
      <div class="search-field">
        <label>위치/소속 UPS</label>
        <select class="search-select" id="fScope" onchange="renderCards()">
          <option value="">전체</option>
          <optgroup label="위치" id="locOptions"></optgroup>
          <optgroup label="소속 UPS" id="upsOptions"></optgroup>
        </select>
      </div>

      <span class="toolbar-spacer"></span>
      <div class="switch-field">
        <span id="refreshLabel">자동갱신주기 : 5초</span>
        <label class="switch">
          <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
          <span class="switch-track"></span>
        </label>
      </div>
    </div>

    <!-- 카드 그리드 -->
    <div id="batrtGrid" class="batrt-grid"></div>

  </div>

  <!-- 상세 트렌드 모달 -->
  <div class="modal-overlay" id="trendModal">
    <div class="modal" style="max-width:680px;">
      <div class="modal-header">
        <h3 id="trendTitle">배터리 상세 트렌드</h3>
        <button class="modal-close" onclick="trendClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="trend-legend">
          <span class="legend-item"><i class="legend-dot" style="background:#3498db;"></i>SOC</span>
          <span class="legend-item"><i class="legend-dot" style="background:#1a5276;"></i>SOH</span>
          <span class="legend-item"><i class="legend-dot" style="background:#e08a1e;"></i>온도</span>
        </div>
        <div id="trendChart"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="trendClose()">닫기</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="battery-realtime.js"></script>
</body>
</html>
