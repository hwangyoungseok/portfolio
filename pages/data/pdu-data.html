<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDU 데이터 조회 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="pdu-data.css">
</head>
<body data-page="data/pdu-data">

<!--
  화면: 데이터 조회 > PDU 데이터 조회
  설명: G/W가 수집한 PDU raw 계측데이터를 기간·항목(복수선택)별로 그리드 조회 + 엑셀 export + 컬럼 정렬. (UPS 데이터 조회와 동일 패턴)
-->

<div id="umsContent">
  <div class="content">

    <div class="search-bar">
      <div class="search-field">
        <label>대상 PDU</label>
        <div class="msel" id="mselDev">
          <button type="button" class="msel-btn" onclick="mselToggle('mselDev')">
            <span id="mselDevLabel">전체</span><span class="caret">&#9662;</span>
          </button>
          <div class="msel-panel" id="mselDevPanel"></div>
        </div>
      </div>

      <div class="search-field">
        <label>조회기간</label>
        <div class="search-daterange">
          <input class="search-input" type="date" id="fFrom">
          <span class="date-sep">~</span>
          <input class="search-input" type="date" id="fTo">
        </div>
        <div class="date-preset">
          <button type="button" class="btn" id="presetToday" onclick="applyPreset('today')">오늘</button>
          <button type="button" class="btn" id="preset7" onclick="applyPreset('7d')">최근7일</button>
          <button type="button" class="btn" id="preset30" onclick="applyPreset('30d')">최근30일</button>
        </div>
      </div>

      <div class="search-field">
        <label>계측 항목</label>
        <div class="msel" id="mselMetric">
          <button type="button" class="msel-btn" onclick="mselToggle('mselMetric')">
            <span id="mselMetricLabel">전체</span><span class="caret">&#9662;</span>
          </button>
          <div class="msel-panel" id="mselMetricPanel"></div>
        </div>
      </div>

      <div class="search-actions">
        <button class="btn btn-primary" onclick="renderGrid()">조회</button>
        <button class="btn" onclick="resetSearch()">초기화</button>
      </div>
    </div>

    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gridCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <button class="btn" onclick="umsToast('엑셀로 내보냈습니다. (목업)')">엑셀 Export</button>
      </div>

      <div class="grid-scroll">
        <table class="grid-table">
          <thead><tr id="gridHead"></tr></thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="paging" id="paging"></div>
    </div>

  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="pdu-data.js"></script>
</body>
</html>
