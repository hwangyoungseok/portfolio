<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>칠러 Trend 차트 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="chiller-trend.css">
</head>
<body data-page="data/chiller-trend">

<!--
  화면: 데이터 조회 > 칠러 Trend 차트
  설명: 칠러 계측값의 시계열 추이를 라인차트로 시각화(줌/팬, 범례 토글). 하단 항목별 요약(평균/최대/최소). (UPS Trend 차트와 동일 패턴)
-->

<div id="umsContent">
  <div class="content">

    <div class="search-bar">
      <div class="search-field">
        <label>대상 칠러</label>
        <div class="msel" id="mselDev">
          <button type="button" class="msel-btn" onclick="mselToggle('mselDev')">
            <span id="mselDevLabel">CH-1F-01</span><span class="caret">&#9662;</span>
          </button>
          <div class="msel-panel" id="mselDevPanel"></div>
        </div>
      </div>

      <div class="search-field">
        <label>조회기간</label>
        <div class="search-daterange">
          <input class="search-input" type="date" id="fFrom">
          <span class="date-sep">~</span>
          <input class="search-input" type="date" id="fTo">
        </div>
        <div class="date-preset">
          <button type="button" class="btn" id="presetToday" onclick="applyPreset('today')">오늘</button>
          <button type="button" class="btn" id="preset7" onclick="applyPreset('7d')">최근7일</button>
          <button type="button" class="btn" id="preset30" onclick="applyPreset('30d')">최근30일</button>
        </div>
      </div>

      <div class="search-field">
        <label>계측 항목</label>
        <div class="msel" id="mselMetric">
          <button type="button" class="msel-btn" onclick="mselToggle('mselMetric')">
            <span id="mselMetricLabel">전체</span><span class="caret">&#9662;</span>
          </button>
          <div class="msel-panel" id="mselMetricPanel"></div>
        </div>
      </div>

      <div class="search-actions">
        <button class="btn btn-primary" onclick="renderChart()">조회</button>
        <button class="btn" onclick="resetSearch()">초기화</button>
      </div>
    </div>

    <div class="trend-card">
      <div class="trend-toolbar">
        <span class="trend-hint">차트 영역을 드래그하면 구간이 확대됩니다. 더블클릭하면 원래대로 돌아옵니다.</span>
        <span class="toolbar-spacer"></span>
        <button class="btn" onclick="umsToast('차트를 이미지로 저장했습니다. (목업)')">이미지 Export</button>
        <button class="btn" onclick="umsToast('엑셀로 내보냈습니다. (목업)')">엑셀 Export</button>
      </div>

      <div class="trend-body">
        <div class="trend-chart-wrap" id="chartWrap">
          <div id="chartSvgHost"></div>
          <div class="trend-zoom-box" id="zoomBox"></div>
        </div>
        <div class="trend-legend" id="legend"></div>
      </div>
    </div>

    <div class="grid-wrap" style="flex:none;">
      <div class="toolbar"><b style="font-size:12px;color:#444;">항목별 요약</b></div>
      <div class="grid-scroll">
        <table class="grid-table">
          <thead><tr><th>계열</th><th>평균</th><th>최대</th><th>최소</th></tr></thead>
          <tbody id="summaryBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="chiller-trend.js"></script>
</body>
</html>
