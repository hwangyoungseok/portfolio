<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>칠러 관리 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="chiller-list.css">
</head>
<body data-page="facility/chiller-list">

<!--
  화면: 설비관리 > 칠러 관리
  칠러 자산 등록·조회·수정·삭제. 검색바 + 그리드 + 등록/수정 모달 + 우측 상세 패널. (UPS 관리와 동일 패턴)
  참고: docu/2.design/UMS_화면정의서_김진호.csv
-->

<div id="umsContent">
  <div class="content">

    <div class="search-bar">
      <div class="search-field"><label>위치</label><select class="search-select" id="fLoc"></select></div>
      <div class="search-field"><label>Vendor</label><select class="search-select" id="fVendor"></select></div>
      <div class="search-field"><label>통신방식</label><select class="search-select" id="fComm"></select></div>
      <div class="search-field"><label>통신상태</label>
        <select class="search-select" id="fLink">
          <option value="">전체</option><option value="on">온라인</option><option value="off">오프라인</option>
        </select>
      </div>
      <div class="search-field"><label>운영상태</label>
        <select class="search-select" id="fOp">
          <option value="">전체</option><option value="ok">정상</option><option value="warn">경고</option>
          <option value="major">Major</option><option value="crit">Critical</option>
        </select>
      </div>
      <div class="search-field"><label>검색어</label>
        <input class="search-input" id="q" placeholder="칠러명 / S/N / 모델명" onkeyup="if(event.key==='Enter')chlRender()">
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="chlRender()">조회</button>
        <button class="btn" onclick="chlReset()">초기화</button>
      </div>
    </div>

    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="chlCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <button class="btn" onclick="chlImportOpen()">엑셀 임포트</button>
        <button class="btn" onclick="umsToast('엑셀 다운로드 (목업)')">엑셀 다운로드</button>
        <button class="btn btn-primary" onclick="chlOpen(null)">+ 칠러 등록</button>
      </div>

      <div class="grid-scroll">
        <table class="grid-table chl-table">
          <thead>
            <tr>
              <th>No</th><th>칠러명</th><th>위치</th><th>Vendor</th><th>모델명</th><th>S/N</th>
              <th>냉각능력(RT)</th><th>냉매종류</th><th>통신방식</th><th>연결 G/W</th><th>통신상태</th><th>운영상태</th><th>설치일자</th><th>수정/삭제</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="paging">
        <button class="page-btn">&#9664;</button>
        <button class="page-btn active">1</button>
        <button class="page-btn">&#9654;</button>
      </div>
    </div>

  </div>

  <!-- 우측 상세 패널 -->
  <div class="drawer-mask" id="chlMask" onclick="chlDetailClose()"></div>
  <aside class="drawer" id="chlDrawer">
    <div class="drawer-header">
      <h3 id="dTitle">칠러 상세</h3>
      <button class="modal-close" onclick="chlDetailClose()">&#10005;</button>
    </div>
    <div class="drawer-body" id="dBody"></div>
    <div class="drawer-footer">
      <button class="btn" onclick="chlEditFromDetail()">수정</button>
      <button class="btn btn-primary" onclick="chlDetailClose()">닫기</button>
    </div>
  </aside>

  <!-- 등록/수정 모달 -->
  <div class="modal-overlay" id="chlModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="mTitle">칠러 등록</h3>
        <button class="modal-close" onclick="chlModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-label req">칠러명</div><input class="form-input" id="m-name">
          <div class="form-label req">위치</div><select class="form-select" id="m-loc"></select>
          <div class="form-label req">Vendor</div><select class="form-select" id="m-vendor"></select>
          <div class="form-label">모델명</div><input class="form-input" id="m-model">
          <div class="form-label">S/N</div><input class="form-input" id="m-sn">
          <div class="form-label">냉각능력(RT)</div><input class="form-input" id="m-rt" type="number" min="0">
          <div class="form-label">냉매종류</div><select class="form-select" id="m-ref"></select>
          <div class="form-label req">통신방식</div>
          <div class="radio-group">
            <label><input type="radio" name="m-comm" value="BACnet" checked> BACnet</label>
            <label><input type="radio" name="m-comm" value="Modbus"> Modbus</label>
          </div>
          <div class="form-label">통신정보</div>
          <div class="form-inline">
            <input class="form-input" id="m-ip" placeholder="IP 주소" style="flex:2;">
            <input class="form-input" id="m-port" placeholder="Port" style="flex:1;">
          </div>
          <div class="form-label">연결 G/W</div><select class="form-select" id="m-gw"></select>
          <div class="form-label">설치일자</div><input class="form-input" id="m-date" type="date">
          <div class="form-label">비고</div><textarea class="form-textarea" id="m-memo" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="chlModalClose()">취소</button>
        <button class="btn btn-primary" onclick="chlSave()">저장</button>
      </div>
    </div>
  </div>

  <!-- 엑셀 임포트 -->
  <div class="modal-overlay" id="chlImportModal">
    <div class="modal" style="width:380px;">
      <div class="modal-header">
        <h3>엑셀 일괄 등록</h3>
        <button class="modal-close" onclick="chlImportClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <label class="import-file-row" for="chlImportFile">
          <span class="btn">파일 선택</span>
          <span class="import-file-name" id="chlImportFileName">선택된 파일 없음</span>
        </label>
        <input type="file" id="chlImportFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="chlImportPick(this)">
        <div class="import-mode">
          <label><input type="radio" name="chlImportMode" value="merge" checked> 기존 데이터에 업데이트</label>
          <label><input type="radio" name="chlImportMode" value="replace"> 전체 삭제 후 신규 등록</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="chlImportClose()">취소</button>
        <button class="btn btn-primary" onclick="chlImportRun()">가져오기</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 -->
  <div class="modal-overlay" id="delModal">
    <div class="confirm-modal">
      <p>선택한 <span class="confirm-hl">칠러를 삭제</span>하시겠습니까?</p>
      <div class="confirm-btns">
        <button class="btn btn-primary" onclick="chlDelete()">예</button>
        <button class="btn btn-danger" onclick="delModalClose()">아니오</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="chiller-list.js"></script>
</body>
</html>
