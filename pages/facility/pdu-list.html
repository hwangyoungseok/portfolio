<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDU 관리 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="pdu-list.css">
</head>
<body data-page="facility/pdu-list">

<!--
  화면: 설비관리 > PDU 관리
  PDU 자산 등록·조회·수정·삭제. 검색바 + 그리드 + 등록/수정 모달 + 우측 상세 패널. (UPS 관리와 동일 패턴)
  참고: docu/2.design/UMS_화면정의서_김진호.csv
-->

<div id="umsContent">
  <div class="content">

    <div class="search-bar">
      <div class="search-field"><label>위치</label><select class="search-select" id="fLoc"></select></div>
      <div class="search-field"><label>Vendor</label><select class="search-select" id="fVendor"></select></div>
      <div class="search-field"><label>통신방식</label><select class="search-select" id="fComm"></select></div>
      <div class="search-field"><label>통신상태</label>
        <select class="search-select" id="fLink">
          <option value="">전체</option><option value="on">온라인</option><option value="off">오프라인</option>
        </select>
      </div>
      <div class="search-field"><label>운영상태</label>
        <select class="search-select" id="fOp">
          <option value="">전체</option><option value="ok">정상</option><option value="warn">경고</option>
          <option value="major">Major</option><option value="crit">Critical</option>
        </select>
      </div>
      <div class="search-field"><label>검색어</label>
        <input class="search-input" id="q" placeholder="PDU명 / S/N / 모델명" onkeyup="if(event.key==='Enter')pduRender()">
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="pduRender()">조회</button>
        <button class="btn" onclick="pduReset()">초기화</button>
      </div>
    </div>

    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="pduCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <button class="btn" onclick="umsToast('엑셀 다운로드 (목업)')">엑셀 다운로드</button>
        <button class="btn btn-primary" onclick="pduOpen(null)">+ PDU 등록</button>
      </div>

      <div class="grid-scroll">
        <table class="grid-table pdu-table">
          <thead>
            <tr>
              <th>No</th><th>PDU명</th><th>위치</th><th>Vendor</th><th>모델명</th><th>S/N</th>
              <th>유형</th><th>상</th><th>아웃렛</th><th>정격전류(A)</th><th>정격전압(V)</th>
              <th>통신방식</th><th>연결 G/W</th><th>통신상태</th><th>운영상태</th><th>상위전원</th><th>설치일자</th><th>수정/삭제</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="paging">
        <button class="page-btn">&#9664;</button>
        <button class="page-btn active">1</button>
        <button class="page-btn">&#9654;</button>
      </div>
    </div>

  </div>

  <!-- 우측 상세 패널 -->
  <div class="drawer-mask" id="pduMask" onclick="pduDetailClose()"></div>
  <aside class="drawer" id="pduDrawer">
    <div class="drawer-header">
      <h3 id="dTitle">PDU 상세</h3>
      <button class="modal-close" onclick="pduDetailClose()">&#10005;</button>
    </div>
    <div class="drawer-body" id="dBody"></div>
    <div class="drawer-footer am-drawer-footer">
      <button class="btn" onclick="pduEditFromDetail()">수정</button>
      <button class="btn btn-primary" onclick="pduDetailClose()">닫기</button>
    </div>
  </aside>

  <!-- 등록/수정 모달 -->
  <div class="modal-overlay" id="pduModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="mTitle">PDU 등록</h3>
        <button class="modal-close" onclick="pduModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-label req">PDU명</div><input class="form-input" id="m-name">
          <div class="form-label req">위치</div><select class="form-select" id="m-loc"></select>
          <div class="form-label req">Vendor</div><select class="form-select" id="m-vendor"></select>
          <div class="form-label">모델명</div><input class="form-input" id="m-model">
          <div class="form-label">S/N</div><input class="form-input" id="m-sn">
          <div class="form-label">유형</div><select class="form-select" id="m-kind"></select>
          <div class="form-label">상</div>
          <div class="radio-group">
            <label><input type="radio" name="m-phase" value="단상" checked> 단상</label>
            <label><input type="radio" name="m-phase" value="3상"> 3상</label>
          </div>
          <div class="form-label">아웃렛 수</div><input class="form-input" id="m-outlet" type="number" min="0">
          <div class="form-label">정격전류(A)</div><input class="form-input" id="m-amp" type="number" min="0">
          <div class="form-label">정격전압(V)</div><input class="form-input" id="m-volt" type="number" min="0">
          <div class="form-label req">통신방식</div>
          <div class="radio-group">
            <label><input type="radio" name="m-comm" value="SNMP" checked> SNMP</label>
            <label><input type="radio" name="m-comm" value="Modbus"> Modbus</label>
          </div>
          <div class="form-label">통신정보</div>
          <div class="form-inline">
            <input class="form-input" id="m-ip" placeholder="IP 주소" style="flex:2;">
            <input class="form-input" id="m-port" placeholder="Port" style="flex:1;">
            <input class="form-input" id="m-community" placeholder="Community" style="flex:2;">
          </div>
          <div class="form-label">연결 G/W</div><select class="form-select" id="m-gw"></select>
          <div class="form-label">상위전원</div><select class="form-select" id="m-src"></select>
          <div class="form-label">설치일자</div><input class="form-input" id="m-date" type="date">
          <div class="form-label">비고</div><textarea class="form-textarea" id="m-memo" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="pduModalClose()">취소</button>
        <button class="btn btn-primary" onclick="pduSave()">저장</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 -->
  <div class="modal-overlay" id="delModal">
    <div class="confirm-modal">
      <p>선택한 <span class="confirm-hl">PDU를 삭제</span>하시겠습니까?</p>
      <div class="confirm-btns">
        <button class="btn btn-primary" onclick="pduDelete()">예</button>
        <button class="btn btn-danger" onclick="delModalClose()">아니오</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="pdu-list.js"></script>
</body>
</html>
