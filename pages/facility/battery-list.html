<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배터리 관리 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="battery-list.css">
</head>
<body data-page="facility/battery-list">

<!--
  화면: 설비관리 > 배터리 관리
  설명: UPS에 소속된 배터리(팩) 등록·조회·수정·삭제. 검색바 + 그리드 + 모달.
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색조건 -->
    <div class="search-bar">
      <div class="search-field"><label>소속 UPS</label><select class="search-select" id="fUps"></select></div>
      <div class="search-field"><label>위치</label><select class="search-select" id="fLoc"></select></div>
      <div class="search-field"><label>배터리 종류</label>
        <select class="search-select" id="fType">
          <option value="">전체</option>
          <option value="리튬이온">리튬이온</option>
          <option value="납축">납축</option>
        </select>
      </div>
      <div class="search-field"><label>검색어</label>
        <input class="search-input" id="q" placeholder="검색어를 입력하세요." onkeyup="if(event.key==='Enter')renderGrid()">
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="renderGrid()">조회</button>
        <button class="btn" onclick="resetSearch()">초기화</button>
      </div>
    </div>

    <!-- 그리드 -->
    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gridCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <button class="btn" onclick="batImportOpen()">엑셀 임포트</button>
        <button class="btn" onclick="umsToast('엑셀로 내보냈습니다. (목업)')">엑셀 Export</button>
        <button class="btn btn-primary" onclick="batOpen(null)">+ 등록</button>
      </div>

      <div class="grid-scroll">
        <table class="grid-table">
          <thead>
            <tr>
              <th>No</th><th>배터리 ID</th><th>소속 UPS명</th><th>제조사</th><th>종류</th>
              <th>용량(Ah)</th><th>설치일자</th><th>SOH(%)</th><th>상태</th><th>기능</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="paging" id="paging"></div>
    </div>

  </div>

  <!-- 등록/수정 모달 -->
  <div class="modal-overlay" id="batModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="mTitle">배터리 등록</h3>
        <button class="modal-close" onclick="batModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-label req">소속 UPS</div><select class="form-select" id="m-ups"></select>
          <div class="form-label req">배터리 ID/S/N</div><input class="form-input" id="m-id" placeholder="배터리ID/S/N을 입력하세요.">
          <div class="form-label">제조사</div><input class="form-input" id="m-maker" placeholder="제조사를 입력하세요.">
          <div class="form-label req">종류</div>
          <div class="radio-group">
            <label><input type="radio" name="m-type" value="리튬이온" checked> 리튬이온</label>
            <label><input type="radio" name="m-type" value="납축"> 납축</label>
          </div>
          <div class="form-label">용량(Ah)</div><input class="form-input" id="m-cap" type="number" min="0" placeholder="용량을 입력하세요.">
          <div class="form-label">설치일자</div><input class="form-input" id="m-date" type="date">
          <div class="form-label">비고</div><textarea class="form-textarea" id="m-memo" rows="2" placeholder="비고를 입력하세요."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="batModalClose()">취소</button>
        <button class="btn btn-primary" onclick="batSave()">저장</button>
      </div>
    </div>
  </div>

  <!-- 우측 상세 패널 -->
  <div class="drawer-mask" id="batMask" onclick="batDetailClose()"></div>
  <aside class="drawer" id="batDrawer">
    <div class="drawer-header">
      <h3 id="dTitle">배터리 상세</h3>
      <button class="modal-close" onclick="batDetailClose()">&#10005;</button>
    </div>
    <div class="drawer-body" id="dBody"></div>
    <div class="drawer-footer">
      <button class="btn" onclick="batEditFromDetail()">수정</button>
      <button class="btn btn-primary" onclick="batDetailClose()">닫기</button>
    </div>
  </aside>

  <!-- 엑셀 임포트 -->
  <div class="modal-overlay" id="batImportModal">
    <div class="modal" style="width:380px;">
      <div class="modal-header">
        <h3>엑셀 일괄 등록</h3>
        <button class="modal-close" onclick="batImportClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <label class="import-file-row" for="batImportFile">
          <span class="btn">파일 선택</span>
          <span class="import-file-name" id="batImportFileName">선택된 파일 없음</span>
        </label>
        <input type="file" id="batImportFile" accept=".xlsx,.xls,.csv" style="display:none" onchange="batImportPick(this)">
        <div class="import-mode">
          <label><input type="radio" name="batImportMode" value="merge" checked> 기존 데이터에 업데이트</label>
          <label><input type="radio" name="batImportMode" value="replace"> 전체 삭제 후 신규 등록</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="batImportClose()">취소</button>
        <button class="btn btn-primary" onclick="batImportRun()">가져오기</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 -->
  <div class="modal-overlay" id="delModal">
    <div class="confirm-modal">
      <p>선택한 <span class="confirm-hl">배터리를 삭제</span>하시겠습니까?</p>
      <div class="confirm-btns">
        <button class="btn btn-primary" onclick="batDelete()">예</button>
        <button class="btn btn-danger" onclick="delModalClose()">아니오</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="battery-list.js"></script>
</body>
</html>
