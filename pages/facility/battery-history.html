<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배터리 교체 이력 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="battery-history.css">
</head>
<body data-page="facility/battery-history">

<!--
  화면: 설비관리 > 배터리 교체 이력 관리
  UPS별 배터리 교체 작업 이력 기록·조회. 검색바 + 그리드 + 등록/수정 모달 + 우측 상세 패널.
  상세패널: 교체 정보 + 구/신 배터리 스펙 인라인 (교체 시점 스냅샷). 배터리 관리 화면 링크는 걸지 않음.
  참고: docu/2.design/UMS_화면정의서_김진호.csv
-->

<div id="umsContent">
  <div class="content">

    <div class="search-bar">
      <div class="search-field"><label>소속 UPS</label><select class="search-select" id="fUps"></select></div>
      <div class="search-field"><label>위치</label><select class="search-select" id="fLoc"></select></div>
      <div class="search-field"><label>교체사유</label><select class="search-select" id="fReason"></select></div>
      <div class="search-field"><label>기간</label>
        <input type="date" class="search-input" id="fFrom" style="min-width:132px;">
        <span style="color:#999;">~</span>
        <input type="date" class="search-input" id="fTo" style="min-width:132px;">
        <button class="btn" type="button" onclick="bhPreset('90d')">최근 3개월</button>
        <button class="btn" type="button" onclick="bhPreset('1y')">1년</button>
      </div>
      <div class="search-field"><label>검색어</label>
        <input class="search-input" id="q" placeholder="배터리ID / 작업자" onkeyup="if(event.key==='Enter')bhRender()">
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="bhRender()">조회</button>
        <button class="btn" onclick="bhReset()">초기화</button>
      </div>
    </div>

    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="bhCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <button class="btn" onclick="umsToast('엑셀 다운로드 (목업)')">엑셀 다운로드</button>
        <button class="btn btn-primary" onclick="bhOpen(null)">+ 교체 이력 등록</button>
      </div>

      <div class="grid-scroll">
        <table class="grid-table bh-table">
          <thead>
            <tr>
              <th style="width:56px;">No</th><th style="width:120px;">교체일자</th><th>소속 UPS</th><th>위치</th>
              <th>구 배터리ID</th><th>신 배터리ID</th><th style="width:110px;">교체사유</th><th style="width:90px;">작업자</th>
              <th>비고</th><th style="width:84px;">수정/삭제</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="paging">
        <button class="page-btn">&#9664;</button>
        <button class="page-btn active">1</button>
        <button class="page-btn">&#9654;</button>
      </div>
    </div>

  </div>

  <!-- 우측 상세 패널 -->
  <div class="drawer-mask" id="bhMask" onclick="bhDetailClose()"></div>
  <aside class="drawer" id="bhDrawer">
    <div class="drawer-header">
      <h3 id="dTitle">교체 이력 상세</h3>
      <button class="modal-close" onclick="bhDetailClose()">&#10005;</button>
    </div>
    <div class="drawer-body" id="dBody"></div>
    <div class="drawer-footer">
      <button class="btn" onclick="bhEditFromDetail()">수정</button>
      <button class="btn btn-primary" onclick="bhDetailClose()">닫기</button>
    </div>
  </aside>

  <!-- 등록/수정 모달 -->
  <div class="modal-overlay" id="bhModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="mTitle">교체 이력 등록</h3>
        <button class="modal-close" onclick="bhModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-label req">소속 UPS</div><select class="form-select" id="m-ups" onchange="bhFillOldBat()"></select>
          <div class="form-label req">교체일자</div><input class="form-input" id="m-date" type="date">
          <div class="form-label req">구 배터리ID</div><select class="form-select" id="m-old"></select>
          <div class="form-label req">신 배터리ID</div><input class="form-input" id="m-new" placeholder="예) BAT-1F-A-01-N">
          <div class="form-label">교체사유</div><select class="form-select" id="m-reason"></select>
          <div class="form-label">작업자</div><input class="form-input" id="m-worker">
          <div class="form-label">비고</div><textarea class="form-textarea" id="m-memo" rows="2"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="bhModalClose()">취소</button>
        <button class="btn btn-primary" onclick="bhSave()">저장</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 -->
  <div class="modal-overlay" id="delModal">
    <div class="confirm-modal">
      <p>선택한 <span class="confirm-hl">교체 이력을 삭제</span>하시겠습니까?</p>
      <div class="confirm-btns">
        <button class="btn btn-primary" onclick="bhDelete()">예</button>
        <button class="btn btn-danger" onclick="delModalClose()">아니오</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="battery-history.js"></script>
</body>
</html>
