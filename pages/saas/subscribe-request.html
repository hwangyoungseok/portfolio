<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구독 요청 관리 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="subscribe-request.css">
</head>
<body data-page="saas/subscribe-request">

<!--
  화면: SaaS 관리 > 구독 요청 관리   (호스트 모드 전용)
  설명: 고객이 [구독 > 구독 현황]에서 보낸 구독 변경/연장/해지 요청을 접수·검토·승인·반려한다.
        고객 화면에서 보낸 요청은 localStorage(ums.subscribe.requests)에 쌓이므로
        여기서 상태를 바꾸면 고객의 [구독 > 요청 내역]에도 그대로 반영된다.
  ---------------------------------------------------------------------
   - 공통 컴포넌트(.search-bar / .grid-wrap / .grid-table / .modal-overlay+.modal / .badge 등)는
     shared/common.css 참고
-->

<div id="umsContent">
  <div class="content">

    <!-- 처리 현황 요약 -->
    <div class="sum-row" id="summary"></div>

    <!-- 검색조건 -->
    <div class="search-bar">
      <div class="search-field"><label>테넌트</label><select class="search-select" id="fTenant" style="min-width:150px;"></select></div>
      <div class="search-field"><label>요청 유형</label>
        <select class="search-select" id="fType">
          <option value="">전체</option>
          <option value="change">에디션 변경</option>
          <option value="extend">기간 연장</option>
          <option value="cancel">해지</option>
        </select></div>
      <div class="search-field"><label>처리 상태</label>
        <select class="search-select" id="fState">
          <option value="">전체</option>
          <option value="new">접수</option>
          <option value="review">검토 중</option>
          <option value="done">승인</option>
          <option value="reject">반려</option>
          <option value="canceled">취소</option>
        </select></div>
      <div class="search-field"><label>요청 일시</label>
        <input class="search-input" id="fFrom" type="date" style="min-width:140px;">
        <span style="color:#98a2b3;">~</span>
        <input class="search-input" id="fTo" type="date" style="min-width:140px;"></div>
      <div class="search-field"><label>검색어</label>
        <input class="search-input" id="q" placeholder="요청번호 / 에디션 / 사유"
               onkeyup="if(event.key==='Enter')renderGrid()"></div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="renderGrid()">조회</button>
        <button class="btn" onclick="resetSearch()">초기화</button>
      </div>
    </div>

    <!-- 그리드 -->
    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gridCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <button class="btn" onclick="umsToast('엑셀 다운로드 (목업)')">엑셀 다운로드</button>
      </div>

      <div class="grid-scroll">
        <table class="grid-table" id="reqTable">
          <thead>
            <tr>
              <th style="width:170px;">처리</th>
              <th style="width:120px;">요청번호</th>
              <th style="width:130px;">테넌트</th>
              <th class="sortable" data-sort="at" onclick="sortBy('at')" style="width:140px;">요청 일시<span class="sort-ind"></span></th>
              <th style="width:100px;">요청 유형</th>
              <th>내용</th>
              <th style="width:110px;">희망 적용일</th>
              <th class="sortable" data-sort="state" onclick="sortBy('state')" style="width:95px;">처리 상태<span class="sort-ind"></span></th>
              <th style="width:140px;">처리 일시</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="pane-paging">
        <select class="search-select" id="pSize" onchange="go('size')" style="min-width:70px;">
          <option>10</option><option>20</option><option>50</option>
        </select>
        <span class="hint">건씩 보기</span>
        <span class="page-info" id="pInfo">0 - 0 / 전체 0 건</span>
        <span class="toolbar-spacer"></span>
        <button class="page-btn" onclick="go('first')">처음</button>
        <button class="page-btn" onclick="go('prev')">이전</button>
        <button class="page-btn active" id="pNo">1</button>
        <button class="page-btn" onclick="go('next')">다음</button>
        <button class="page-btn" onclick="go('last')">마지막</button>
      </div>
    </div>

  </div>

  <!-- 요청 상세 모달 -->
  <div class="modal-overlay" id="detModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="dTitle">요청 상세</h3>
        <button class="modal-close" onclick="detModalClose()">&#10005;</button>
      </div>
      <div class="modal-body" id="detBody"></div>
      <div class="modal-footer">
        <button class="btn" id="btnReview" onclick="setReview()">검토 중으로</button>
        <button class="btn btn-danger" id="btnReject" onclick="actOpen('reject')">반려</button>
        <button class="btn btn-primary" id="btnApprove" onclick="actOpen('done')">승인</button>
        <button class="btn" onclick="detModalClose()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 승인 / 반려 처리 모달 -->
  <div class="modal-overlay" id="actModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="aTitle">승인</h3>
        <button class="modal-close" onclick="actModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-label">요청</div><div class="dv-box" id="a-req">-</div>
          <div class="form-label">내용</div><div class="dv-box" id="a-flow">-</div>
          <div class="form-label" id="l-apply">적용일</div>
          <input class="form-input" id="a-apply" type="date">
          <div class="form-label req" id="l-reply">고객 회신</div>
          <textarea class="form-textarea" id="a-reply" rows="3"
                    placeholder="고객의 [요청 내역] 화면에 표시됩니다."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="actModalClose()">취소</button>
        <button class="btn btn-primary" id="a-submit" onclick="actSubmit()">처리</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="subscribe-request.js"></script>
</body>
</html>
