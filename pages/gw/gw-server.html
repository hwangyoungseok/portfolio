   - 공통 컴포넌트(.search-bar / .grid-wrap / .toolbar / .grid-table / .paging /
     .modal-overlay+.modal / .form-grid / .badge / .drawer / umsToast 등)는 shared/common.css 참고

                pages/facility/location-manage.*  (좌측 트리+우측 입력영역)
   - 완성하면 shared/layout.js 의 DONE 목록에 "gw/gw-server" 추가
