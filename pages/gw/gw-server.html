<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GW 서버 상태 모니터링 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="gw-server.css">
</head>
<body data-page="gw/gw-server">

<!--
  화면: GW > GW 서버 상태 모니터링
  설명: G/W가 설치된 PC(서버)의 CPU/메모리/디스크 사용률 게이지 카드 + OS/가동시간. 카드 클릭 시 최근 24h 추이 라인차트. 임계 초과 시 카드 경고색.
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색조건 -->
    <div class="search-bar">
      <div class="search-field"><label>GW</label><select class="search-select" id="fGw"></select></div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="renderCards()">조회</button>
        <button class="btn" onclick="resetSearch()">초기화</button>
      </div>
    </div>

    <!-- 카드 그리드 -->
    <div id="gwsrvGrid" class="gwsrv-grid"></div>

  </div>

  <!-- 24h 추이 상세 모달 -->
  <div class="modal-overlay" id="trendModal">
    <div class="modal" style="max-width:720px;">
      <div class="modal-header">
        <h3 id="trendTitle">리소스 추이</h3>
        <button class="modal-close" onclick="trendClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="trend-legend">
          <span class="legend-item"><i class="legend-dot" style="background:#1a6ed8;"></i>CPU</span>
          <span class="legend-item"><i class="legend-dot" style="background:#2e9e5b;"></i>메모리</span>
          <span class="legend-item"><i class="legend-dot" style="background:#e08a1e;"></i>디스크</span>
        </div>
        <div id="trendChart"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="trendClose()">닫기</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="gw-server.js"></script>
</body>
</html>
