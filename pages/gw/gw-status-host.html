<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GW 상태 모니터링 (호스트) - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="gw-status-host.css">
</head>
<body data-page="gw/gw-status-host">

<!--
  화면: GW > GW 상태 모니터링 (호스트 전용)
  설명: 전 고객사 GW 의 통신 연결상태 실시간 확인. 고객사 필터 + 그리드 + 자동 새로고침.
-->

<div id="umsContent">
  <div class="content">

    <div class="search-bar">
      <div class="search-field"><label>고객사</label><select class="search-select" id="fTenant"></select></div>
      <div class="search-field"><label>위치</label><select class="search-select" id="fLoc"></select></div>
      <div class="search-field"><label>상태</label>
        <select class="search-select" id="fState">
          <option value="">전체</option><option value="on">온라인</option><option value="off">오프라인</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="gsRender()">조회</button>
      <span class="toolbar-spacer"></span>
      <div class="switch-field">
        <span>자동 새로고침</span>
        <label class="switch"><input type="checkbox" id="autoRefresh" onchange="gsToggleAuto()"><span class="switch-track"></span></label>
      </div>
    </div>

    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gsCount">0</b>대</span>
        <span class="toolbar-spacer"></span>
        <span id="gsLast" style="font-size:11px;color:#98a2b3;"></span>
      </div>
      <div class="grid-scroll">
        <table class="grid-table gs-table">
          <thead>
            <tr>
              <th style="width:120px;">고객사</th><th>GW명</th><th>위치</th><th style="width:80px;">상태</th>
              <th style="width:160px;">마지막 통신시각</th><th style="width:150px;">전송 지연/버퍼링</th><th style="width:90px;">연결 설비</th>
            </tr>
          </thead>
          <tbody id="gsBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="gw-status-host.js"></script>
</body>
</html>
