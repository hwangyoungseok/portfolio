<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GW 상태 모니터링 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="gw-status.css">
</head>
<body data-page="gw/gw-status">

<!--
  화면: GW > GW 상태 모니터링
  설명: 각 G/W의 통신 연결상태(온라인/오프라인) 실시간 확인. 목록/카드(마지막 통신시각, 전송지연/버퍼링, 연결설비수) + 자동 새로고침.
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색조건 -->
    <div class="search-bar">
      <div class="search-field"><label>위치</label><select class="search-select" id="fLoc"></select></div>
      <div class="search-field"><label>상태</label>
        <select class="search-select" id="fState">
          <option value="">전체</option>
          <option value="on">온라인</option>
          <option value="off">오프라인</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="renderGrid()">조회</button>

      <span class="toolbar-spacer"></span>
      <div class="switch-field">
        <span>자동 새로고침</span>
        <label class="switch">
          <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()">
          <span class="switch-track"></span>
        </label>
      </div>
    </div>

    <!-- 그리드 -->
    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gridCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <span id="lastRefresh" style="font-size:11px;color:#98a2b3;"></span>
      </div>

      <div class="grid-scroll">
        <table class="grid-table">
          <thead>
            <tr>
              <th>GW명</th><th>위치</th><th>상태</th><th>마지막 통신시각</th>
              <th>데이터 전송 지연/버퍼링 건수</th><th>연결 UPS 대수</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="gw-status.js"></script>
</body>
</html>
