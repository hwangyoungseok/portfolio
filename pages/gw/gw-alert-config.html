<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GW 알림 설정 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="gw-alert-config.css">
</head>
<body data-page="gw/gw-alert-config">

<!--
  화면: GW > GW 알림 설정 (호스트 전용)
  설명: GW/GW서버 이상 시 메일·문자 통지 설정. 이벤트 "종류"는 고정(코드 하드코딩) — 이벤트마다
        규칙(임계값/대상 그룹/채널)을 여러 개 추가할 수 있다 (umsGwNotifyRule, TenantId=NULL 전역,
        (TenantId, EventType)에 UNIQUE 제약 없음 — 같은 이벤트에 행 여러 개 허용하는 구조).
        규칙별 사용/해제 토글은 값을 지우지 않고 켜고 끄기만 함(삭제와 별개).
        판정·발송은 GWM. 실제 발생 이력은 여기 아님(알람/GW 상태 화면).
  참고: docu/2.design/GW_개발요구사항.txt [12]
-->

<div id="umsContent">
  <div class="content">

    <div class="gac-note">
      <b>호스트 전역 규칙</b> — 어느 고객사의 GW 든 아래 이벤트가 발생하면 지정한 대상에게 통지합니다.
      (고객사별 개별 규칙은 각 고객사 화면에서 별도 설정)
    </div>

    <div class="gac-list" id="gacList"></div>

    <div class="gac-bottom">
      <span id="gacSaved" class="gac-saved"></span>
      <span class="toolbar-spacer"></span>
      <button class="btn" onclick="gacReset()">기본값</button>
      <button class="btn btn-primary" onclick="gacSave()">저장</button>
    </div>

  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="gw-alert-config.js"></script>
</body>
</html>
