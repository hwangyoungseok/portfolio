<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GW 관리 (호스트) - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="gw-list-host.css">
</head>
<body data-page="gw/gw-list-host">

<!--
  화면: GW > GW 관리 (호스트 전용)
  설명: 전 고객사(테넌트)의 GW 를 조회. 고객사 필터 + 그리드 + 행 클릭 시 소속 설비 보기.
        등록/수정은 고객이 하므로 호스트 화면은 조회 전용.
-->

<div id="umsContent">
  <div class="content">

    <div class="search-bar">
      <div class="search-field"><label>고객사</label><select class="search-select" id="fTenant"></select></div>
      <div class="search-field"><label>위치</label><select class="search-select" id="fLoc"></select></div>
      <div class="search-field"><label>사용여부</label>
        <select class="search-select" id="fUse">
          <option value="">전체</option><option value="1">사용</option><option value="0">미사용</option>
        </select>
      </div>
      <div class="search-field"><label>검색어</label>
        <input class="search-input" id="q" placeholder="GW명 / 설치 PC" onkeyup="if(event.key==='Enter')ghRender()">
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="ghRender()">조회</button>
        <button class="btn" onclick="ghReset()">초기화</button>
      </div>
    </div>

    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="ghCount">0</b>대</span>
      </div>
      <div class="grid-scroll">
        <table class="grid-table gh-table">
          <thead>
            <tr>
              <th style="width:50px;">No</th><th style="width:120px;">고객사</th><th>GW명</th>
              <th>위치</th><th>설치 PC</th><th style="width:70px;">버전</th>
              <th style="width:110px;">업데이트</th>
              <th style="width:90px;">연결 설비</th><th style="width:80px;">사용여부</th>
            </tr>
          </thead>
          <tbody id="ghBody"></tbody>
        </table>
      </div>
      <div class="paging">
        <button class="page-btn">&#9664;</button><button class="page-btn active">1</button><button class="page-btn">&#9654;</button>
      </div>
    </div>

  </div>

  <!-- 상세: 버전 관리 + 소속 설비 -->
  <div class="drawer-mask" id="ghMask" onclick="ghDrawerClose()"></div>
  <aside class="drawer" id="ghDrawer">
    <div class="drawer-header">
      <h3 id="ghdTitle">GW 상세</h3>
      <button class="modal-close" onclick="ghDrawerClose()">&#10005;</button>
    </div>
    <div class="drawer-body">
      <div class="gh-ver-box">
        <div class="gh-ver-t">버전 관리</div>
        <div class="form-grid" style="grid-template-columns:80px 1fr;">
          <div class="form-label">현재버전</div><div id="ghCurVer" class="gh-cur-ver">-</div>
          <div class="form-label">목표버전</div><select class="form-select" id="ghTargetVer"></select>
          <div class="form-label">업데이트</div>
          <div class="radio-group">
            <label><input type="radio" name="ghMode" value="Manual" checked> Manual (관리자가 [지금 업데이트] 실행)</label>
            <label><input type="radio" name="ghMode" value="Auto"> Auto (GW가 주기적으로 스스로 확인 후 진행)</label>
          </div>
        </div>
        <div class="gh-upd-status" id="ghUpdStatus"></div>
        <div class="gh-ver-btns">
          <button class="btn" onclick="ghVerSave()">저장</button>
          <button class="btn btn-primary" onclick="ghUpdateNow()">지금 업데이트</button>
        </div>
      </div>
      <div id="ghdBody"></div>
    </div>
    <div class="drawer-footer" style="justify-content:flex-end;">
      <button class="btn btn-primary" onclick="ghDrawerClose()">닫기</button>
    </div>
  </aside>
</div>

<script src="../../shared/layout.js"></script>
<script src="gw-list-host.js"></script>
</body>
</html>
