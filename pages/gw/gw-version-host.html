<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GW 버전관리 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="gw-version-host.css">
</head>
<body data-page="gw/gw-version-host">

<!--
  화면: GW > GW 버전관리 (호스트 전용)
  설명: GW 배포 패키지(tar.gz) 버전 파일 관리. 관리자가 미리 서버(포탈API/GWM이 접근 가능한 경로)에
        올려둔 파일의 절대경로를 등록하면, 등록 시 서버가 그 경로의 파일을 읽어 해시를 계산한다(목업).
        여기 등록된 버전은 [GW 관리] 화면에서 GW별 목표버전으로 지정해서 쓴다.
  참고: ums_schema.sql umsGwVersion / ums_sequences.md #11
-->

<div id="umsContent">
  <div class="content">

    <div class="gv-note">
      파일은 <b>미리 배포서버에 올려두고</b> 여기서는 그 <b>절대경로</b>만 입력해요. (웹 업로드 아님 — 배포 파일 용량이 커서)
      저장하면 서버가 해당 경로 파일을 읽어 해시(SHA256)를 자동 계산해요.
    </div>

    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gvCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <button class="btn btn-primary" onclick="gvOpen()">+ 버전 등록</button>
      </div>
      <div class="grid-scroll">
        <table class="grid-table gv-table">
          <thead>
            <tr>
              <th style="width:50px;">No</th><th style="width:100px;">버전코드</th>
              <th>파일경로</th><th style="width:180px;">파일 해시(SHA256)</th>
              <th>릴리즈 노트</th><th style="width:150px;">등록일시</th><th style="width:60px;">삭제</th>
            </tr>
          </thead>
          <tbody id="gvBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- 등록 모달 -->
  <div class="modal-overlay" id="gvModal">
    <div class="modal">
      <div class="modal-header">
        <h3>버전 등록</h3>
        <button class="modal-close" onclick="gvModalClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-label req">버전코드</div><input class="form-input" id="m-code" placeholder="예: 2.4.0">
          <div class="form-label req">파일경로</div><input class="form-input" id="m-path" placeholder="예: /data/gw-releases/gw-2.4.0.tar.gz">
          <div class="form-label">릴리즈 노트</div><textarea class="form-textarea" id="m-note" rows="4" placeholder="변경 사항을 입력하세요"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="gvModalClose()">취소</button>
        <button class="btn btn-primary" onclick="gvSave()">저장</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 -->
  <div class="modal-overlay" id="delModal">
    <div class="confirm-modal">
      <p>선택한 <span class="confirm-hl">버전을 삭제</span>하시겠습니까?<br><span style="font-size:11.5px;color:#98a2b3;">이 버전을 목표버전으로 지정한 GW가 있으면 삭제할 수 없어요.</span></p>
      <div class="confirm-btns">
        <button class="btn btn-primary" onclick="gvDelete()">예</button>
        <button class="btn btn-danger" onclick="delModalClose()">아니오</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="gw-version-host.js"></script>
</body>
</html>
