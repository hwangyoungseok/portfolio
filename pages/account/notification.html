<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알림 보기 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="notification.css">
</head>
<body data-page="account/notification">

<!--
  화면: (헤더 우측 사용자 메뉴) > 알림 보기   /   헤더 [알림] > 전체 보기
  설명: 로그인한 사용자가 "수신한" 알림 전체 목록. 읽음 처리 + 관련 화면 이동.
  대응 테이블: AbpNotifications ⋈ AbpNotificationSendRecords (UserId = 본인)
  ---------------------------------------------------------------------
  ※ 목록 데이터는 shared/layout.js 의 NOTIS 를 window.umsNotis 로 공유받는다.
     헤더 패널은 최근 6건, 이 화면은 전체를 보여준다.
     읽음 처리 후 window.umsNotiSync() 를 부르면 헤더 배지가 함께 갱신된다.
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색 -->
    <div class="search-bar">
      <div class="search-field"><label>읽음 상태</label>
        <select class="search-select" id="fRead">
          <option value="">전체</option>
          <option value="unread">읽지 않음</option>
          <option value="read">읽음</option>
        </select>
      </div>
      <div class="search-field"><label>분류</label>
        <select class="search-select" id="fKind"><option value="">전체</option></select>
      </div>
      <div class="search-field"><label>중요도</label>
        <select class="search-select" id="fSev">
          <option value="">전체</option>
          <option value="crit">긴급</option>
          <option value="warn">주의</option>
          <option value="info">정보</option>
        </select>
      </div>
      <div class="search-field"><label>기간</label>
        <input class="search-input" id="fFrom" type="date" style="min-width:140px;">
        <span class="search-sep">~</span>
        <input class="search-input" id="fTo" type="date" style="min-width:140px;">
      </div>
      <div class="search-field"><label>검색어</label>
        <input class="search-input" id="q" placeholder="제목 / 내용" style="min-width:200px;"
               onkeyup="if(event.key==='Enter')search()">
      </div>
      <span class="toolbar-spacer"></span>
      <button class="btn btn-primary" onclick="search()">&#128269; 조회</button>
      <button class="btn" onclick="resetSearch()">초기화</button>
    </div>

    <!-- 목록 -->
    <div class="grid-wrap">
      <div class="toolbar">
        <span class="nt-count">전체 <b id="ntTotal">0</b>건 · 읽지 않음 <b id="ntUnread" class="nt-unread-n">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <button class="btn" id="ntReadAll" onclick="readAll()">모두 읽음</button>
      </div>

      <div class="grid-scroll">
        <table class="grid-table" id="ntTable">
          <thead>
            <tr>
              <th style="width:80px;">중요도</th>
              <th style="width:90px;">분류</th>
              <th>내용</th>
              <th class="sortable" data-sort="time" onclick="sortBy('time')" style="width:170px;">수신 시각<span class="sort-ind"></span></th>
              <th style="width:90px;">상태</th>
              <th style="width:110px;">관리</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>

      <div class="pane-paging">
        <select class="search-select" id="pSize" onchange="go('size')" style="min-width:70px;">
          <option>10</option><option>20</option><option>50</option>
        </select>
        <span class="hint">건씩 보기</span>
        <span class="page-info" id="pInfo">0 - 0 / 전체 0 건</span>
        <span class="toolbar-spacer"></span>
        <button class="page-btn" onclick="go('first')">처음</button>
        <button class="page-btn" onclick="go('prev')">이전</button>
        <button class="page-btn active" id="pNo">1</button>
        <button class="page-btn" onclick="go('next')">다음</button>
        <button class="page-btn" onclick="go('last')">마지막</button>
      </div>
    </div>

  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="notification.js"></script>
</body>
</html>
