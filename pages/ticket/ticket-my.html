<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 티켓 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="ticket-my.css">
</head>
<body data-page="ticket/ticket-my">

<!--
  화면: 티켓 > 내 티켓
  설명: 나에게 할당된 티켓 목록·처리. 검색바 + 그리드 + 상세 모달(설명/코멘트/처리이력/상태변경).
        상세는 큰 모달로 열리고, 코멘트는 처리이력과 같은 라벨-박스 행 안에 목록과 작성창(첨부파일 포함)이 함께 담긴다.
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색조건 -->
    <div class="search-bar">
      <div class="search-field"><label>상태</label>
        <select class="search-select" id="fStatus">
          <option value="">전체</option>
          <option value="open">오픈</option>
          <option value="assigned">진행 대기</option>
          <option value="progress">진행 중</option>
          <option value="done">완료</option>
        </select>
      </div>
      <label class="search-field" style="cursor:pointer;"><input type="checkbox" id="fOverdue"> 기한 초과</label>
      <div class="search-field"><label>우선순위</label>
        <select class="search-select" id="fPri">
          <option value="">전체</option>
          <option value="warning">Warning</option>
          <option value="minor">Minor</option>
          <option value="major">Major</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="search-field"><label>조회기간</label>
        <div class="search-daterange">
          <input class="search-input" type="date" id="fFrom">
          <span class="date-sep">~</span>
          <input class="search-input" type="date" id="fTo">
        </div>
      </div>
      <div class="search-field"><label>검색어</label>
        <input class="search-input" id="q" placeholder="키워드를 입력하세요." onkeyup="if(event.key==='Enter')renderGrid()">
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="renderGrid()">조회</button>
        <button class="btn" onclick="resetSearch()">초기화</button>
      </div>
    </div>

    <!-- 그리드 -->
    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gridCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <button class="btn btn-primary customer-only" onclick="tkCreateOpen()">티켓 생성</button>
      </div>

      <div class="grid-scroll">
        <table class="grid-table">
          <thead>
            <tr>
              <th>No</th><th>티켓번호</th><th>제목</th><th>대상</th><th>우선순위</th>
              <th>상태</th><th>등록일</th><th>처리기한</th><th>최근 업데이트</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- 상세 모달 -->
  <div class="modal-overlay" id="tkModal">
    <div class="modal tk-modal">
      <div class="modal-header">
        <h3 id="dTitle">티켓 상세</h3>
        <button class="modal-close" onclick="tkDetailClose()">&#10005;</button>
      </div>
      <div class="modal-body" id="dBody"></div>

      <div class="modal-footer">
        <button class="btn" onclick="tkDetailClose()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 티켓 생성 모달 (고객 전용) -->
  <div class="modal-overlay" id="tkCreateModal">
    <div class="modal">
      <div class="modal-header">
        <h3>티켓 생성</h3>
        <button class="modal-close" onclick="tkCreateClose()">&#10005;</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-label req">제목</div><input class="form-input" id="tc-title" placeholder="문제를 간단히 요약해 주세요">
          <div class="form-label req">대상 유형</div>
          <select class="form-select" id="tc-type" onchange="tkCreateFillTarget()">
            <option value="UPS">UPS</option>
            <option value="PDU">PDU</option>
            <option value="칠러">칠러</option>
            <option value="배터리">배터리</option>
            <option value="GW">GW</option>
          </select>
          <div class="form-label req">대상 설비</div><select class="form-select" id="tc-target"></select>
          <div class="form-label req">우선순위</div>
          <select class="form-select" id="tc-pri">
            <option value="warning">Warning</option>
            <option value="minor" selected>Minor</option>
            <option value="major">Major</option>
            <option value="critical">Critical</option>
          </select>
          <div class="form-label req">상세 내용</div><textarea class="form-textarea" id="tc-desc" rows="4" placeholder="어떤 문제인지 자세히 설명해 주세요"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="tkCreateClose()">취소</button>
        <button class="btn btn-primary" onclick="tkCreateSubmit()">등록</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="ticket-my.js"></script>
</body>
</html>
