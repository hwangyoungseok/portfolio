<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 티켓 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="ticket-my.css">
</head>
<body data-page="ticket/ticket-my">

<!--
  화면: 티켓 > 내 티켓
  설명: 나에게 할당된 티켓 목록·처리. 검색바 + 그리드 + 상세 모달(설명/코멘트/처리이력/상태변경).
        상세는 큰 모달로 열리고, 코멘트는 처리이력과 같은 라벨-박스 행 안에 목록과 작성창(첨부파일 포함)이 함께 담긴다.
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색조건 -->
    <div class="search-bar">
      <div class="search-field"><label>상태</label>
        <select class="search-select" id="fStatus">
          <option value="">전체</option>
          <option value="pending">대기중</option>
          <option value="progress">진행중</option>
          <option value="done">완료</option>
        </select>
      </div>
      <div class="search-field"><label>우선순위</label>
        <select class="search-select" id="fPri">
          <option value="">전체</option>
          <option value="warning">Warning</option>
          <option value="minor">Minor</option>
          <option value="major">Major</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="search-field"><label>조회기간</label>
        <div class="search-daterange">
          <input class="search-input" type="date" id="fFrom">
          <span class="date-sep">~</span>
          <input class="search-input" type="date" id="fTo">
        </div>
      </div>
      <div class="search-field"><label>검색어</label>
        <input class="search-input" id="q" placeholder="키워드를 입력하세요." onkeyup="if(event.key==='Enter')renderGrid()">
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="renderGrid()">조회</button>
        <button class="btn" onclick="resetSearch()">초기화</button>
      </div>
    </div>

    <!-- 그리드 -->
    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gridCount">0</b>건</span>
      </div>

      <div class="grid-scroll">
        <table class="grid-table">
          <thead>
            <tr>
              <th>No</th><th>티켓번호</th><th>제목</th><th>대상</th><th>우선순위</th>
              <th>상태</th><th>등록일</th><th>처리기한</th><th>최근 업데이트</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- 상세 모달 -->
  <div class="modal-overlay" id="tkModal">
    <div class="modal tk-modal">
      <div class="modal-header">
        <h3 id="dTitle">티켓 상세</h3>
        <button class="modal-close" onclick="tkDetailClose()">&#10005;</button>
      </div>
      <div class="modal-body" id="dBody"></div>

      <div class="modal-footer">
        <button class="btn" onclick="tkDetailClose()">닫기</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="ticket-my.js"></script>
</body>
</html>
