<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미할당 티켓 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="ticket-unassigned.css">
</head>
<body data-page="ticket/ticket-unassigned">

<!--
  화면: 티켓 > 미할당 티켓
  설명: 담당자 미지정 티켓 목록. 검색바 + 그리드(다중선택) + [담당자 지정]/[일괄 할당].
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색조건 -->
    <div class="search-bar">
      <div class="search-field"><label>우선순위</label>
        <select class="search-select" id="fPri">
          <option value="">전체</option>
          <option value="warning">Warning</option>
          <option value="minor">Minor</option>
          <option value="major">Major</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="search-field"><label>대상유형</label>
        <select class="search-select" id="fType">
          <option value="">전체</option>
          <option value="UPS">UPS</option>
          <option value="PDU">PDU</option>
          <option value="칠러">칠러</option>
          <option value="배터리">배터리</option>
          <option value="GW">GW</option>
        </select>
      </div>
      <div class="search-field"><label>조회기간</label>
        <div class="search-daterange">
          <input class="search-input" type="date" id="fFrom">
          <span class="date-sep">~</span>
          <input class="search-input" type="date" id="fTo">
        </div>
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="renderGrid()">조회</button>
        <button class="btn" onclick="resetSearch()">초기화</button>
      </div>
    </div>

    <!-- 그리드 -->
    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gridCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <span style="font-size:12px;color:#666;">선택 <b id="selCount">0</b>건</span>
        <button class="btn btn-primary" id="bulkBtn" onclick="tkOpenAssign(null)" disabled>일괄 할당</button>
      </div>

      <div class="grid-scroll">
        <table class="grid-table">
          <thead>
            <tr>
              <th class="chk-cell"><input type="checkbox" id="chkAll" onchange="tkToggleAll(this.checked)"></th>
              <th>No</th><th>티켓번호</th><th>제목</th><th>대상</th><th>우선순위</th>
              <th>상태</th><th>등록일</th><th>처리기한</th><th>최근 업데이트</th><th>담당자 지정</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- 담당자 지정 모달 -->
  <div class="modal-overlay" id="assignModal">
    <div class="confirm-modal" style="width:340px;">
      <p id="assignMsg">담당자를 선택하세요.</p>
      <div class="form-grid" style="grid-template-columns:70px 1fr;margin-bottom:16px;">
        <div class="form-label">담당자</div>
        <select class="form-select" id="assignee">
          <option>김민준</option>
          <option>이서연</option>
          <option>박지훈</option>
          <option>관리자</option>
        </select>
      </div>
      <div class="confirm-btns">
        <button class="btn btn-primary" onclick="tkAssignConfirm()">할당</button>
        <button class="btn btn-danger" onclick="assignModalClose()">취소</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="ticket-unassigned.js"></script>
</body>
</html>
