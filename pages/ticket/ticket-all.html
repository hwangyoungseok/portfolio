<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전체 티켓 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="ticket-all.css">
</head>
<body data-page="ticket/ticket-all">

<!--
  화면: 티켓 > 전체 티켓
  설명: 관리자용 전체 티켓 현황. 검색바 + 그리드(담당자 컬럼, 재할당) + 엑셀 export.
        (구 상단 KPI 카드는 index.html 홈 화면으로 옮김)
-->

<div id="umsContent">
  <div class="content">

    <!-- 검색조건 -->
    <div class="search-bar">
      <div class="search-field"><label>담당자</label><select class="search-select" id="fAssignee"></select></div>
      <div class="search-field"><label>상태</label>
        <select class="search-select" id="fStatus">
          <option value="">전체</option>
          <option value="pending">대기중</option>
          <option value="progress">진행중</option>
          <option value="done">완료</option>
        </select>
      </div>
      <div class="search-field"><label>우선순위</label>
        <select class="search-select" id="fPri">
          <option value="">전체</option>
          <option value="warning">Warning</option>
          <option value="minor">Minor</option>
          <option value="major">Major</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="search-field"><label>위치</label><select class="search-select" id="fLoc"></select></div>
      <div class="search-field"><label>조회기간</label>
        <div class="search-daterange">
          <input class="search-input" type="date" id="fFrom">
          <span class="date-sep">~</span>
          <input class="search-input" type="date" id="fTo">
        </div>
      </div>
      <div class="search-actions">
        <button class="btn btn-primary" onclick="renderGrid()">조회</button>
        <button class="btn" onclick="resetSearch()">초기화</button>
      </div>
    </div>

    <!-- 그리드 -->
    <div class="grid-wrap">
      <div class="toolbar">
        <span style="font-size:12px;color:#666;">총 <b id="gridCount">0</b>건</span>
        <span class="toolbar-spacer"></span>
        <button class="btn" onclick="umsToast('엑셀로 내보냈습니다. (목업)')">엑셀 Export</button>
      </div>

      <div class="grid-scroll">
        <table class="grid-table">
          <thead>
            <tr>
              <th>No</th><th>티켓번호</th><th>제목</th><th>대상</th><th>우선순위</th>
              <th>상태</th><th>등록일</th><th>처리기한</th><th>최근 업데이트</th><th>담당자</th><th class="host-only">담당자 지정</th>
            </tr>
          </thead>
          <tbody id="gridBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- 담당자 재할당 모달 -->
  <div class="modal-overlay" id="assignModal">
    <div class="confirm-modal" style="width:340px;">
      <p id="assignMsg">담당자를 선택하세요.</p>
      <div class="form-grid" style="grid-template-columns:70px 1fr;margin-bottom:16px;">
        <div class="form-label">담당자</div>
        <select class="form-select" id="assignee">
          <option>김민준</option>
          <option>이서연</option>
          <option>박지훈</option>
          <option>관리자</option>
        </select>
      </div>
      <div class="confirm-btns">
        <button class="btn btn-primary" onclick="tkAssignConfirm()">할당</button>
        <button class="btn btn-danger" onclick="assignModalClose()">취소</button>
      </div>
    </div>
  </div>

  <!-- 우측 상세 패널 -->
  <div class="drawer-mask" id="tkMask" onclick="tkDetailClose()"></div>
  <aside class="drawer" id="tkDrawer">
    <div class="drawer-header">
      <h3 id="dTitle">티켓 상세</h3>
      <button class="modal-close" onclick="tkDetailClose()">&#10005;</button>
    </div>
    <div class="drawer-body" id="dBody"></div>
    <div class="drawer-footer">
      <button class="btn btn-primary" onclick="tkDetailClose()">닫기</button>
    </div>
  </aside>
</div>

<script src="../../shared/layout.js"></script>
<script src="ticket-all.js"></script>
</body>
</html>
