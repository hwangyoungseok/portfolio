<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>위치 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="location-status.css">
</head>
<body data-page="status/location-status">

<!--
  화면: 설비현황 > 위치계통
  설명: 전력계통(status/power-topology)과 같은 패턴(KPI + 좌측 트리 + 우측 전력계통정보/위치정보/
        상세정보 3단 패널)이지만, 좌측 트리의 기준 축이 전력계통이 아니라 위치 계층
        (location-manage.js의 위치 트리)이다. 사이트>건물>전산실 아래에 그 위치에 설치된
        PDU/UPS/칠러가 형제로 붙고, UPS 아래에는 배터리가 자식으로 붙는다. 위치 노드는 클릭할
        수 없고 설비(PDU/UPS/칠러/배터리)만 클릭 가능하다. 설비를 클릭하면 우측에 그 설비의
        실제 전력 연결관계(전력계통 페이지와 동일한 PDU↔UPS/칠러↔배터리 관계)를 보여주는
        전력계통정보, 그 안에 나온 설비들의 실제 설치 위치 breadcrumb인 위치정보, 각 설비관리
        페이지의 상세와 동일한 상세정보가 표시된다. 읽기 전용.
-->

<div id="umsContent">
  <div class="content">

    <!-- KPI -->
    <div class="loc-kpi-grid" id="locKpiGrid"></div>

    <div class="loc-layout">

      <!-- 좌측: 위치 계통 트리 -->
      <div class="loc-col-left">
        <div class="grid-wrap loc-tree-panel">
          <div class="toolbar">
            <input class="search-input" id="locSearch" placeholder="설비명 검색" style="flex:1;">
            <button class="btn btn-primary" id="locSearchBtn">검색</button>
          </div>
          <div class="loc-tree-body" id="locTreeBody"></div>
        </div>
      </div>

      <!-- 우측: 전력계통정보 / 위치정보 / 상세정보 -->
      <div class="loc-col-right">
        <div class="loc-panel">
          <h3>전력계통정보</h3>
          <div class="loc-diagram-scroll"><div class="loc-diagram-inner" id="locDiagramInner"></div></div>
        </div>

        <div class="loc-panel">
          <h3>위치정보</h3>
          <div id="locZoneContent"></div>
        </div>

        <div class="loc-panel">
          <h3 id="locInfoTitle">-</h3>
          <div id="locInfoRows"></div>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="location-status.js"></script>
</body>
</html>
