<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맵 관리 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="map-manage.css">
</head>
<body data-page="status/map-manage">

<!--
  화면: 설비현황 > 맵 관리
  설명: 배경 도면(기본 샘플 SVG 또는 업로드 이미지) 위에 설비 목록을 드래그해서 배치 → 좌표·표시명 저장.
        저장 데이터는 localStorage(ums.map). 맵 화면(status/map-view)이 이 데이터를 읽어 상태 조회.
        실제 백엔드 전환 시 umsMapLayout(도면) / umsMapInfo(설비 배치좌표·표시명).
-->

<div id="umsContent">
  <div class="content mm-content">
    <div class="mm-wrap">

      <!-- 좌: 캔버스 -->
      <div class="mm-canvas-col">
        <div class="mm-canvas-toolbar">
          <select class="search-select mm-map-sel" id="mmMapSel" onchange="mmSelectMap()"></select>
          <button class="btn" onclick="mmNewMap()">+ 새 맵</button>
          <button class="btn btn-danger" onclick="mmDeleteMap()">맵 삭제</button>
          <input class="mm-name-input" id="mmName" placeholder="맵 이름 (예: 본사 IDC 1층)">
          <span class="toolbar-spacer"></span>
          <span class="mm-hint">설비를 캔버스로 드래그해 배치 · 배치된 설비는 드래그로 이동, 클릭하면 편집 · 배경은 파일을 캔버스에 드롭하거나 Ctrl+V 붙여넣기</span>
        </div>
        <div class="mm-canvas" id="mmCanvas">
          <div class="mm-bg" id="mmBg"></div>
        </div>
      </div>

      <!-- 우: 사이드 -->
      <aside class="mm-side">
        <div class="mm-side-sec">
          <div class="mm-side-title">배경 도면</div>
          <div class="mm-btn-row">
            <button class="btn" onclick="mmUseSample()">샘플 도면</button>
            <button class="btn" onclick="document.getElementById('mmFile').click()">이미지 업로드</button>
          </div>
          <input type="file" id="mmFile" accept="image/*" hidden>
        </div>

        <div class="mm-side-sec mm-side-grow">
          <div class="mm-side-title">설비 목록 <span class="mm-side-sub">드래그해서 배치</span></div>
          <select class="search-select mm-pal-type" id="mmPalType" onchange="mmRenderPalette()">
            <option value="">전체 유형</option>
            <option>UPS</option><option>PDU</option><option>칠러</option><option>배터리</option>
          </select>
          <div class="mm-palette" id="mmPalette"></div>
        </div>

        <div class="mm-side-sec">
          <div class="mm-btn-row">
            <button class="btn btn-primary mm-btn-wide" onclick="mmSave()">저장</button>
            <button class="btn" onclick="mmAskReset()">초기화</button>
          </div>
          <div class="mm-count-line">배치된 설비 <b id="mmCount">0</b>개</div>
        </div>
      </aside>

    </div>
  </div>

  <!-- 노드 편집 팝오버 -->
  <div class="mm-pop" id="mmPop" hidden>
    <div class="mm-pop-row"><label>표시명</label><input id="mmPopLabel" onkeydown="if(event.key==='Enter')mmApplyNode()"></div>
    <div class="mm-pop-actions">
      <button class="btn btn-danger" onclick="mmDeleteNode()">삭제</button>
      <button class="btn btn-primary" onclick="mmApplyNode()">적용</button>
    </div>
  </div>

  <!-- 초기화 확인 -->
  <div class="modal-overlay" id="mmResetModal">
    <div class="confirm-modal">
      <p>배치한 설비를 <span class="confirm-hl">모두 지울까요?</span></p>
      <div class="confirm-btns">
        <button class="btn btn-primary" onclick="mmReset()">예</button>
        <button class="btn btn-danger" onclick="mmResetClose()">아니오</button>
      </div>
    </div>
  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="map-manage.js"></script>
</body>
</html>
