<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맵 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="map-view.css">
</head>
<body data-page="status/map-view">

<!--
  화면: 설비현황 > 맵
  설명: 맵 관리(status/map-manage)에서 등록한 맵을 콤보로 선택 → 배경 도면 위 설비 아이콘을
        운영상태 색으로 표시하는 상태 모니터링 보드. 자동갱신 시 목업 상태값이 주기적으로 변함.
        아이콘 클릭 → 우측에 해당 설비 현재 상태 카드(read-only). 데이터: localStorage(ums.maps).
-->

<div id="umsContent">
  <div class="content mv-content">

    <div class="mv-top" id="mvTop">
      <select class="search-select mv-map-sel" id="mvMapSel" onchange="mvSelectMap()"></select>
      <div class="mv-summary" id="mvSummary"></div>
      <span class="toolbar-spacer"></span>
      <span class="mv-updated">최근 갱신 <b id="mvUpdated">—</b></span>
      <label class="mv-auto"><input type="checkbox" id="mvAuto" checked onchange="mvToggleAuto()"> 자동갱신</label>
      <button class="btn" onclick="mvRefresh(true)">새로고침</button>
    </div>

    <div class="mv-wrap" id="mvWrap">
      <div class="mv-canvas-col">
        <div class="mv-canvas" id="mvCanvas">
          <div class="mv-bg" id="mvBg"></div>
        </div>
        <div class="mv-legend">
          <span><i class="mv-dot s-ok"></i>정상</span>
          <span><i class="mv-dot s-warn"></i>경고</span>
          <span><i class="mv-dot s-major"></i>Major</span>
          <span><i class="mv-dot s-crit"></i>Critical</span>
          <span><i class="mv-dot s-off"></i>오프라인</span>
        </div>
      </div>

      <aside class="mv-side">
        <div class="mv-side-empty" id="mvSideEmpty">설비 아이콘을 클릭하면<br>현재 상태가 표시됩니다.</div>
        <div id="mvCard" hidden></div>
      </aside>
    </div>

    <div class="mv-nomap" id="mvNoMap" hidden>
      <p>등록된 맵이 없습니다.<br>맵 관리에서 도면과 설비 배치를 먼저 등록하세요.</p>
      <a class="btn btn-primary" id="mvGoManage" href="map-manage.html">맵 관리로 이동</a>
    </div>

  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="map-view.js"></script>
</body>
</html>
