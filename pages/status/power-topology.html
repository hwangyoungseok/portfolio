<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전력계통 - UMS</title>
<link rel="stylesheet" href="../../shared/common.css">
<link rel="stylesheet" href="power-topology.css">
</head>
<body data-page="status/power-topology">

<!--
  화면: 설비현황 > 전력계통
  설명: 이 화면이 다루는 설비(PDU/UPS/칠러/배터리)만으로 구성한 계통도. PDU가 최상위이며
        그 아래 UPS/칠러가 형제로, UPS 아래에 배터리가 자식으로 붙는다. 위치 구분 없이 등록된
        전체 설비를 한 트리로 보여준다. 트리에서 설비를 클릭하면 우측에 전력계통정보(주변 연결
        미니 다이어그램)·위치정보(위치 breadcrumb)·상세정보가 표시된다. 상세정보는 각 설비관리
        페이지(ups-list.js 등)에서 해당 row를 클릭했을 때 나오는 상세 내용과 동일하다.
        읽기 전용(구조 변경은 각 설비 등록화면의 "소속" 필드에서 처리).
-->

<div id="umsContent">
  <div class="content">

    <!-- KPI -->
    <div class="topo-kpi-grid" id="topoKpiGrid"></div>

    <div class="topo-layout">

      <!-- 좌측: 계통 트리 -->
      <div class="topo-col-left">
        <div class="grid-wrap topo-tree-panel">
          <div class="toolbar">
            <input class="search-input" id="topoSearch" placeholder="설비명 검색" style="flex:1;">
            <button class="btn btn-primary" id="topoSearchBtn">검색</button>
          </div>
          <div class="topo-tree-body" id="topoTreeBody"></div>
        </div>
      </div>

      <!-- 우측: 전력계통정보 / 위치정보 / 상세정보 -->
      <div class="topo-col-right">
        <div class="topo-panel">
          <h3>전력계통정보</h3>
          <div class="topo-diagram-scroll"><div class="topo-diagram-inner" id="topoDiagramInner"></div></div>
        </div>

        <div class="topo-panel">
          <h3>위치정보</h3>
          <div id="topoZoneContent"></div>
        </div>

        <div class="topo-panel">
          <h3 id="topoInfoTitle">-</h3>
          <div id="topoInfoRows"></div>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="../../shared/layout.js"></script>
<script src="power-topology.js"></script>
</body>
</html>
