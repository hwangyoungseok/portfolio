<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMS 통합 관리 시스템</title>
<link rel="stylesheet" href="shared/common.css">
</head>
<body>

<div id="umsContent">
  <div class="content">

    <!-- 티켓 KPI 카드 (티켓 > 전체 티켓 페이지에서 이동) -->
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-card-label">오픈</div><div class="kpi-card-value" id="kpiOpen">0<span class="unit">건</span></div></div>
      <div class="kpi-card"><div class="kpi-card-label">미할당</div><div class="kpi-card-value" id="kpiUnassigned">0<span class="unit">건</span></div></div>
      <div class="kpi-card"><div class="kpi-card-label">대기 중</div><div class="kpi-card-value" id="kpiPending">0<span class="unit">건</span></div></div>
      <div class="kpi-card"><div class="kpi-card-label">진행 중</div><div class="kpi-card-value" id="kpiProgress">0<span class="unit">건</span></div></div>
      <div class="kpi-card"><div class="kpi-card-label">기한초과</div><div class="kpi-card-value" id="kpiOverdue">0<span class="unit">건</span></div></div>
      <div class="kpi-card"><div class="kpi-card-label">총 건수</div><div class="kpi-card-value" id="kpiTotal">0<span class="unit">건</span></div></div>
    </div>
    <div class="kpi-row">
      <div class="kpi-card sev-warning"><div class="kpi-card-label">Warning</div><div class="kpi-card-value" id="kpiWarning">0<span class="unit">건</span></div></div>
      <div class="kpi-card sev-minor"><div class="kpi-card-label">Minor</div><div class="kpi-card-value" id="kpiMinor">0<span class="unit">건</span></div></div>
      <div class="kpi-card sev-major"><div class="kpi-card-label">Major</div><div class="kpi-card-value" id="kpiMajor">0<span class="unit">건</span></div></div>
      <div class="kpi-card sev-critical"><div class="kpi-card-label">Critical</div><div class="kpi-card-value" id="kpiCritical">0<span class="unit">건</span></div></div>
    </div>

    <div class="placeholder-card">
      <b style="font-size:15px;color:#1a1a2e;">UMS 통합 관리 시스템</b><br><br>
      좌측 메뉴에서 화면을 선택하세요.<br>
      <span style="color:#bbb;">※ UI 프로토타입 &mdash; 목업 데이터로 동작합니다. 서버 없이 그대로 열림.</span>
    </div>
  </div>
</div>

<script src="shared/layout.js"></script>
<script src="index.js"></script>
</body>
</html>
